openapi: 3.1.0
info:
  title: ChurnRadar API
  version: 1.0.0
  description: |
    Анализатор рисков оттока клиентов хостинга.

    Все денежные поля передаются в **евроцентах** (целое число, €1 = 100).
    Время — ISO 8601 в UTC.

    Доступ: все методы, кроме `POST /api/v1/auth/login`, `GET /api/v1/auth/providers`
    и SSO-редиректов (OIDC, SAML), требуют сессию (cookie `cr_session`) или `Authorization: Bearer`.
    `GET /metrics` закрыт отдельным токеном сборщика метрик.

    Роли вложены: `analyst` < `marketer` < `admin`. Читать может любой вошедший. Письма,
    рассылки и отметки клиентов (`/customers/{id}/action`, `/customers/{id}/email*`,
    `/mail/campaigns*`) — `marketer` и выше. Модель, данные, симулятор, шаблоны писем, CAC и маржа,
    пользователи — только `admin`. Свои уведомления и профиль — любая роль. Не хватает роли — `403`.
servers:
  - url: http://localhost:8080
    description: Локальный запуск через Docker Compose
tags:
  - name: auth
    description: Вход, сессия, SSO (OIDC и SAML), свой профиль
  - name: users
    description: Управление пользователями панели (только администратор)
  - name: customers
    description: Клиенты и их оценки риска
  - name: actions
    description: С кем связаться сегодня и отметки работы с клиентом
  - name: mail
    description: Письма клиентам, шаблоны, рассылки и их эффективность
  - name: playbooks
    description: Сценарии удержания с контрольной группой и оценкой эффекта
  - name: analytics
    description: Сводные показатели и денежная оценка
  - name: model
    description: Настройки модели risk-score
  - name: source
    description: Загрузка исходных данных
  - name: stream
    description: Живые обновления (Server-Sent Events)
  - name: simulator
    description: Поток демонстрационных изменений данных
  - name: alerts
    description: Критические события и персональные уведомления (сервис alerts)
  - name: ops
    description: Метрики и служебные эндпоинты

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход по логину и паролю
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход. Сессия выставлена в httpOnly cookie `cr_session`.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      operationId: me
      responses:
        '200':
          description: Пользователь текущей сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [auth]
      summary: Сменить свой email
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'], maxLength: 254, description: 'null или пустая строка — убрать' }
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/me/password:
    post:
      tags: [auth]
      summary: Сменить свой пароль
      description: Только для входа по паролю. Остальные сессии пользователя закрываются, текущая остаётся.
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, minLength: 1, maxLength: 256 }
                new_password: { type: string, minLength: 8, maxLength: 256 }
      responses:
        '204': { description: Пароль изменён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/users:
    get:
      tags: [users]
      summary: Пользователи панели (только admin)
      operationId: listUsers
      parameters:
        - name: q
          in: query
          description: Поиск по логину, имени и email
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManagedUser' } }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [users]
      summary: Создать пользователя
      description: |
        С паролем, со сгенерированным временным паролем (поле password пустое, ответ вернёт его
        один раз) или «только SSO» — учётка ждёт первого входа через Authentik с тем же логином.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/ManagedUser' }
                  temporary_password: { type: string, description: Показывается один раз }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Логин занят, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/auth/users/{user_id}:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [users]
      summary: Изменить имя, email, роль или статус
      description: |
        Себя заблокировать или понизить нельзя, последнего активного администратора — тоже (409).
        При блокировке и смене роли все сессии пользователя сбрасываются.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/ManagedUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Последний активный администратор, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [users]
      summary: Удалить пользователя
      operationId: deleteUser
      responses:
        '204': { description: Удалён }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Последний активный администратор, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /api/v1/auth/users/{user_id}/password:
    parameters:
      - { name: user_id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [users]
      summary: Сбросить пароль
      description: Пустой password — сгенерировать временный и вернуть один раз. Сессии пользователя сбрасываются.
      operationId: resetUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: [string, 'null'], minLength: 8, maxLength: 256 }
      responses:
        '200':
          description: Временный пароль
          content:
            application/json:
              schema:
                type: object
                required: [temporary_password]
                properties:
                  temporary_password: { type: string }
        '204': { description: Задан пароль из запроса }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/auth/audit:
    get:
      tags: [users]
      summary: Журнал действий с пользователями
      operationId: userAudit
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Последние записи, новые сверху
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Завершение текущей сессии
      operationId: logout
      responses:
        '204': { description: Сессия завершена }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/providers:
    get:
      tags: [auth]
      summary: Доступные способы входа
      operationId: authProviders
      security: []
      responses:
        '200':
          description: Список способов входа
          content:
            application/json:
              schema:
                type: object
                required: [password, oidc, saml]
                properties:
                  password: { type: boolean }
                  oidc:
                    type: object
                    description: Есть, только когда IdP настроен и отвечает
                    required: [enabled]
                    properties:
                      enabled: { type: boolean }
                      display_name: { type: string, examples: ['Войти через Authentik (OIDC)'] }
                      login_url: { type: string, examples: ['/api/v1/auth/oidc/login'] }
                  saml:
                    type: object
                    description: Есть, только когда метаданные IdP загружены
                    required: [enabled]
                    properties:
                      enabled: { type: boolean }
                      display_name: { type: string, examples: ['Войти через Authentik (SAML)'] }
                      login_url: { type: string, examples: ['/api/v1/auth/saml/login'] }

  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      summary: Начало входа через OIDC (Authorization Code + PKCE)
      operationId: oidcLogin
      security: []
      parameters:
        - name: next
          in: query
          schema: { type: string, default: / }
      responses:
        '302': { description: Редирект на провайдера OIDC }
        '404': { description: OIDC не настроен }

  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Возврат от провайдера OIDC
      operationId: oidcCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 'Сессия создана, редирект в панель' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/saml/metadata:
    get:
      tags: [auth]
      summary: Метаданные SAML Service Provider (entityID и ACS для настройки IdP)
      operationId: samlMetadata
      security: []
      responses:
        '200':
          description: XML метаданных SP
          content:
            application/samlmetadata+xml:
              schema: { type: string }
        '404': { description: SAML выключен }

  /api/v1/auth/saml/login:
    get:
      tags: [auth]
      summary: Начало входа через SAML (SP-initiated, HTTP-Redirect AuthnRequest)
      operationId: samlLogin
      security: []
      parameters:
        - name: next
          in: query
          schema: { type: string, default: / }
      responses:
        '302': { description: Редирект на IdP с SAMLRequest }
        '404': { description: SAML не настроен или IdP недоступен }

  /api/v1/auth/saml/acs:
    post:
      tags: [auth]
      summary: Assertion Consumer Service (HTTP-POST от IdP)
      description: |
        Проверяются подпись ассерции сертификатом IdP, Issuer, Audience, Recipient,
        NotBefore/NotOnOrAfter, InResponseTo (одноразовый ID нашего запроса) и повтор ассерции.
      operationId: samlAcs
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse: { type: string, description: base64 от samlp:Response }
                RelayState: { type: string }
      responses:
        '303':
          description: >-
            Сессия создана и редирект в панель, либо редирект на /login?error=sso
            (ответ не прошёл проверку) или /login?error=forbidden (у пользователя нет роли)

  /api/v1/customers:
    get:
      tags: [customers]
      summary: Список клиентов с оценками риска (рейтинг)
      operationId: listCustomers
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, email, balance, total_replenished, risk_score, expected_loss]
            default: risk_score
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: level
          in: query
          description: Фильтр по уровням через запятую, например `high,medium`
          schema: { type: string, examples: ['high,medium'] }
        - name: search
          in: query
          description: Поиск по email (подстрока) или точному ID
          schema: { type: string }
        - $ref: '#/components/parameters/ReasonFilter'
        - $ref: '#/components/parameters/ReasonScope'
        - $ref: '#/components/parameters/ScoreMin'
        - $ref: '#/components/parameters/ScoreMax'
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        '200':
          description: Страница рейтинга
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}:
    get:
      tags: [customers]
      summary: Подробная оценка клиента, его услуги, признаки и объяснения
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Карточка клиента
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/customers/{id}/charts:
    get:
      tags: [customers]
      summary: Данные для графиков карточки клиента
      description: |
        Баланс по дням против графика автопродлений (до момента, когда кончатся деньги, и ещё
        неделю; не меньше горизонта и не больше года), платежи по месяцам за 12 месяцев и
        score клиента в моменты отправки писем. Отдельной истории score по клиенту в базе нет,
        поэтому score_history пуст, если клиенту ещё не писали.
      operationId: getCustomerCharts
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Ряды для графиков
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerCharts' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/customers/export.csv:
    get:
      tags: [customers]
      summary: Выгрузка клиентов в CSV для рассылки и Excel
      description: |
        Те же фильтры и сортировка, что у списка, но без страниц: все подходящие клиенты
        (до 100 000 строк). Файл в UTF-8 с BOM, разделитель «;», дробная часть через
        запятую — так его без мастера импорта открывает русский Excel. Суммы в евро.

        Колонки: ID, Email, Уровень риска, Риск (баллы), Ожидаемая потеря (€), Баланс (€),
        Пополнения всего (€), Главная причина, Что сделать, Статус.
      operationId: exportCustomers
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, email, balance, total_replenished, risk_score, expected_loss]
            default: risk_score
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: level
          in: query
          description: Фильтр по уровням через запятую, например `high,medium`
          schema: { type: string }
        - name: search
          in: query
          description: Поиск по email (подстрока) или точному ID
          schema: { type: string }
        - name: worklist
          in: query
          description: 'Только очередь «С кем связаться сегодня»: есть оценка, есть потеря, нет действующей отметки'
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/ReasonFilter'
        - $ref: '#/components/parameters/ReasonScope'
        - $ref: '#/components/parameters/ScoreMin'
        - $ref: '#/components/parameters/ScoreMax'
      responses:
        '200':
          description: CSV-файл
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="churnradar-clients-2026-10-24.csv"'] }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}/action:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [actions]
      summary: Отметка работы с клиентом и журнал отметок
      operationId: getCustomerAction
      responses:
        '200':
          description: Текущая отметка и последние 20 записей журнала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [actions]
      summary: Отметить клиента «Письмо отправлено», «Решено» или «Отложено»
      description: |
        Доступно любому вошедшему пользователю, в том числе аналитику: отметка не меняет
        ни данные, ни модель, только очередь. Кто и когда отметил, пишется в журнал.

        «Письмо отправлено» ставится само при отправке письма из панели; вручную — если
        написали из своей почты. Клиент вернётся в очередь, если за срок ожидания не ответил
        или его риск вырос. «Решено» прячет клиента, пока ожидаемая потеря или уровень риска
        не вырастут по сравнению с моментом отметки. «Отложено» прячет до даты.
      operationId: putCustomerAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerActionUpdate' }
      responses:
        '200':
          description: Отметка сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [actions]
      summary: Снять отметку — клиент возвращается в очередь
      operationId: deleteCustomerAction
      responses:
        '200':
          description: Отметка снята (если её не было — ничего не меняется)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/contact-today:
    get:
      tags: [actions]
      summary: С кем связаться сегодня
      description: |
        Клиенты с оценкой риска (не unknown) и ненулевой ожидаемой потерей, по убыванию
        ожидаемой потери: первым идёт тот, на ком можно спасти больше всего денег.
        Клиенты с действующей отметкой («Письмо отправлено» в срок ожидания ответа, «Решено»,
        «Отложено») в очередь не попадают; `marked=true` показывает как раз их.
      operationId: contactToday
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 5 } }
        - { name: marked, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactToday' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}/email/draft:
    post:
      tags: [mail]
      summary: Черновик письма клиенту по шаблону
      description: Шаблон по главной причине риска (или указанный), подстановки уже заполнены.
      operationId: draftCustomerEmail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailDraftRequest' }
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}/email:
    post:
      tags: [mail]
      summary: Отправить письмо клиенту
      description: |
        Письмо уходит по SMTP сразу, в этом же запросе. После отправки клиент получает
        отметку «Письмо отправлено», в журнал пишется тема, кто и когда. Reply-To — почта
        сотрудника (заголовок X-User-Email от шлюза), иначе SMTP_REPLY_TO или SMTP_FROM.
      operationId: sendCustomerEmail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailSendRequest' }
      responses:
        '200':
          description: Письмо отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Почтовый сервер не принял письмо (письмо сохранено со статусом failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Отправка не настроена (нет SMTP_HOST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mail/templates:
    get:
      tags: [mail]
      summary: Шаблоны писем и доступные подстановки
      operationId: listMailTemplates
      responses:
        '200':
          description: Шаблоны
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailTemplates' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mail/templates/{code}:
    put:
      tags: [mail]
      summary: Изменить шаблон (только admin)
      operationId: putMailTemplate
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailTemplatePatch' }
      responses:
        '200':
          description: Шаблон сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/mail/templates/{code}/reset:
    post:
      tags: [mail]
      summary: Вернуть исходный текст шаблона (только admin)
      operationId: resetMailTemplate
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Шаблон с исходным текстом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mail/campaigns/preview:
    post:
      tags: [mail]
      summary: Сколько писем уйдёт в рассылке и пример письма
      operationId: previewMailCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/mail/campaigns:
    get:
      tags: [mail]
      summary: Последние рассылки
      operationId: listMailCampaigns
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Рассылки от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [mail]
      summary: Запустить рассылку
      description: |
        Письма кладутся в очередь и уходят в фоне, не быстрее MAIL_RATE_PER_S в секунду.
        Тем, кому писали за последние skip_days дней, письмо не отправляется. Прогресс —
        GET /api/v1/mail/campaigns/{id}.
      operationId: createMailCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '202':
          description: Рассылка поставлена в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Отправка не настроена (нет SMTP_HOST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mail/campaigns/{id}:
    get:
      tags: [mail]
      summary: Прогресс и итог рассылки
      operationId: getMailCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Рассылка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mail/stats:
    get:
      tags: [mail]
      summary: Сколько писем отправлено и скольким клиентам это помогло
      operationId: mailStats
      responses:
        '200':
          description: Статистика за MAIL_STATS_DAYS дней (по умолчанию 30)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/playbooks:
    get:
      tags: [playbooks]
      summary: Сценарии удержания, готовые шаблоны сценариев и причины риска для условий
      operationId: listPlaybooks
      responses:
        '200':
          description: Сценарии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [playbooks]
      summary: Создать сценарий (только admin)
      description: |
        Включённый сценарий срабатывает после каждого пересчёта оценок. В режиме simulation
        он только записывает в журнал, кого бы задел; в режиме live выполняет действия.
      operationId: createPlaybook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybookInput' }
      responses:
        '201':
          description: Сценарий создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/playbooks/preview:
    post:
      tags: [playbooks]
      summary: Кого правило заденет сейчас и сколько из них уйдёт в контроль
      description: |
        Ничего не выполняет и не записывает. С playbook_id учитываются дневной лимит и пауза
        «не чаще раза в K дней» по уже сработавшим клиентам этого сценария.
      operationId: previewPlaybook
      parameters:
        - { name: playbook_id, in: query, schema: { type: integer, format: int64, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybookInput' }
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/playbooks/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [playbooks]
      summary: Сценарий
      operationId: getPlaybook
      responses:
        '200':
          description: Сценарий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [playbooks]
      summary: Изменить сценарий, включить или выключить (только admin)
      operationId: updatePlaybook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybookInput' }
      responses:
        '200':
          description: Сценарий сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playbook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [playbooks]
      summary: Удалить сценарий вместе с журналом (только admin)
      description: Отправленные письма остаются в истории писем клиента.
      operationId: deletePlaybook
      responses:
        '204': { description: Удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playbooks/{id}/run:
    post:
      tags: [playbooks]
      summary: Запустить сценарий сейчас, не дожидаясь пересчёта (только admin)
      description: Соблюдает режим, дневной лимит и паузу на клиента. Выключенный сценарий тоже можно запустить.
      operationId: runPlaybook
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Итог запуска
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookRunResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playbooks/{id}/runs:
    get:
      tags: [playbooks]
      summary: Журнал запусков сценария
      operationId: listPlaybookRuns
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 20 } }
      responses:
        '200':
          description: Запуски от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlaybookRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playbooks/{id}/hits:
    get:
      tags: [playbooks]
      summary: Клиенты, попавшие под сценарий, с группой и итогом действий
      operationId: listPlaybookHits
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
      responses:
        '200':
          description: Срабатывания от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PlaybookHit' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/playbooks/{id}/uplift:
    get:
      tags: [playbooks]
      summary: Эффект сценария — затронутые против контрольной группы
      description: |
        Для каждого окна (0, 7, 14, 30 дней) берутся клиенты, сработавшие не меньше N дней назад
        (по первому срабатыванию), и их состояние сейчас сравнивается с моментом срабатывания.
        diff — разница долей «затронутые минус контроль», ci_low..ci_high — 95% интервал
        Агрести — Каффо. Если в группе меньше min_group клиентов, verdict = few_data.
      operationId: getPlaybookUplift
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Эффект по окнам
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybookUplift' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/analytics/summary:
    get:
      tags: [analytics]
      summary: Сводные показатели риска и денежная оценка потенциальных потерь
      operationId: getSummary
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/analytics/distribution:
    get:
      tags: [analytics]
      summary: Распределение risk-score по корзинам и деньги по уровням риска
      description: |
        Десять корзин score [0, 10), [10, 20) … [90, 100] с разбивкой по уровням (порог уровня
        может проходить внутри корзины) и выручка с ожидаемой потерей по каждому уровню.
        Клиенты без оценки в корзины не попадают, в levels они есть (unknown).
      operationId: getRiskDistribution
      responses:
        '200':
          description: Распределение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskDistribution' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/analytics/scatter:
    get:
      tags: [analytics]
      summary: Точки «риск × ожидаемая потеря» для графика клиентов
      description: |
        Клиенты с оценкой под теми же фильтрами, что у списка, самые дорогие по ожидаемой
        потере первыми, не больше limit. total — сколько клиентов подходит всего.
      operationId: getRiskScatter
      parameters:
        - name: level
          in: query
          description: Фильтр по уровням через запятую
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string, maxLength: 320 }
        - $ref: '#/components/parameters/ReasonFilter'
        - $ref: '#/components/parameters/ReasonScope'
        - $ref: '#/components/parameters/ScoreMin'
        - $ref: '#/components/parameters/ScoreMax'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 400, default: 300 } }
      responses:
        '200':
          description: Точки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskScatter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/analytics/reasons/{code}:
    get:
      tags: [analytics]
      summary: Всё о причине риска — клиенты, деньги, вклад, что делать
      description: |
        scope=any — клиенты, у которых причина есть среди признаков (как customers в
        top_reasons сводки), scope=main — у которых она главная. expected_loss — часть
        ожидаемой потери этих клиентов, которая приходится именно на причину.
      operationId: getReason
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', examples: [prolong_wait] }
        - name: scope
          in: query
          schema: { type: string, enum: [main, any], default: any }
      responses:
        '200':
          description: Причина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReasonDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/analytics/history:
    get:
      tags: [analytics]
      summary: Как менялись главные цифры сводки
      description: |
        Точки пишет scoring вместе со сводкой: после каждого полного пересчёта и не чаще раза
        в 10 секунд после частичных. Хранится не больше 500 точек, старая половина
        прореживается. От старых к новым.
      operationId: getSummaryHistory
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 500 } }
      responses:
        '200':
          description: История
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/analytics/marketing:
    get:
      tags: [analytics]
      summary: Маркетинговые метрики — MRR, ARPU, отток, LTV, сегменты по риску
      description: |
        Базовые числа scoring считает при каждом пересчёте вместе со сводкой (riskcore.marketing),
        api накладывает маржу и стоимость привлечения (CAC) из настроек. Месяц — 30 дней.
        Прогнозный отток — из модели: risk_score клиента = доля его выручки, которую ожидаем
        потерять за горизонт; доля за горизонт пересчитывается в месяц как 1 − (1 − p)^(30/горизонт).
        LTV = ARPU × маржа / месячный отток клиентов (срок жизни не больше `lifetime.cap_months`).
        Доступно всем вошедшим.
      operationId: getMarketing
      responses:
        '200':
          description: Маркетинговые метрики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marketing' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/analytics/marketing/settings:
    get:
      tags: [analytics]
      summary: Маржа и стоимость привлечения клиента для маркетинговых метрик
      operationId: getMarketingSettings
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [analytics]
      summary: Изменение маржи и CAC (только admin)
      description: Пересчёта модели не запускает — новые значения сразу видны в `/analytics/marketing`.
      operationId: putMarketingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketingSettingsUpdate' }
      responses:
        '200':
          description: Новые настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketingSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/model/settings:
    get:
      tags: [model]
      summary: Действующие настройки и коэффициенты модели
      operationId: getModelSettings
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [model]
      summary: Изменение настроек модели с автоматическим пересчётом
      description: |
        Частичное обновление. Пересчёт запускается асинхронно; о завершении сообщает
        событие `scores.updated` в `/api/v1/stream`. Требуется роль `admin`.
      operationId: patchModelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsPatch' }
      responses:
        '200':
          description: Новое состояние настроек (version увеличена)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/model/settings/preview:
    post:
      tags: [model]
      summary: «Что если» — что изменится после PATCH, без сохранения
      description: |
        Принимает то же тело, что PATCH, и с теми же проверками. Ничего не сохраняет:
        версия настроек и оценки клиентов не меняются. «Было» и «станет» считаются на одном
        снимке данных, «станет» совпадает с тем, что получится после PATCH и пересчёта.
        На базе больше PREVIEW_SAMPLE_SIZE клиентов (по умолчанию 2000) считается выборка,
        тогда `exact: false`. Требуется роль `admin`.
      operationId: previewModelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsPatch' }
      responses:
        '200':
          description: Сравнение «было → станет»
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettingsPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Пришёл более новый запрос предпросмотра, этот не считался
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Сервис оценки недоступен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: Расчёт не уложился в PREVIEW_TIMEOUT_S
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/model/settings/reset:
    post:
      tags: [model]
      summary: Сброс настроек к значениям по умолчанию
      operationId: resetModelSettings
      responses:
        '200':
          description: Настройки по умолчанию (version увеличена)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/model/settings/history:
    get:
      tags: [model]
      summary: Журнал изменений настроек модели
      operationId: modelSettingsHistory
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Изменения от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SettingsChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/model/quality:
    get:
      tags: [model]
      summary: Качество модели на синтетическом будущем
      description: |
        Результаты проверки `python -m tools.calibration`: база из 20 000 синтетических клиентов,
        оценка моделью на момент T и 30 дней будущего в двух сценариях симуляции. Lift по уровням
        риска, ROC и сравнение с простыми правилами, точность и полнота порогов, калибровка,
        прогоны с другими seed. Файл кладётся в образ api при сборке и на лету не меняется.
        `current_model.matches` говорит, совпадает ли код установленной модели с тем, на котором
        считались цифры. Доступно любому вошедшему пользователю.
      operationId: modelQuality
      responses:
        '200':
          description: Результаты проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelQuality' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Файла с результатами нет в сборке или он не прошёл проверку схемы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/source/snapshot:
    put:
      tags: [source]
      summary: Загрузка или полная замена снимка исходных данных
      description: |
        Формат тела совпадает с `data.json` из комплекта кейса. Замена атомарная.
        Пересчёт асинхронный, о завершении сообщает `scores.updated`. Требуется роль `admin`.
      operationId: putSnapshot
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
        - name: reset_history
          in: query
          required: false
          description: |
            Снимок описывает другой набор клиентов: прежняя история статусов удаляется,
            иначе смены статусов между снимками попадают в факт на графике.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSnapshot' }
      responses:
        '202':
          description: Снимок принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/source/events:
    post:
      tags: [source]
      summary: Поток изменений отдельных записей (данные в реальном времени)
      description: |
        Пакет upsert-изменений аккаунтов, услуг и транзакций. Так источник шлёт изменения
        в реальном времени, без полной замены снимка. Требуется роль `admin` или сервисный токен.
      operationId: postSourceEvents
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceChangeBatch' }
      responses:
        '202':
          description: Изменения приняты
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/stream:
    get:
      tags: [stream]
      summary: Живые обновления (Server-Sent Events)
      description: |
        `text/event-stream`. События: `scores.updated`, `settings.updated`, `source.updated`
        (схемы `ScoresUpdatedEvent`, `SettingsUpdatedEvent`, `SourceUpdatedEvent`).
        Каждые 15 с приходит комментарий `: ping`. Поддерживается `Last-Event-ID`.
        Служебное событие `resync` (без `id`, `data: {"reason": "..."}`) означает, что часть
        событий могла потеряться: после восстановления связи notifier с NATS
        (`nats_connected`, `nats_reconnected`) или если реплика не может воспроизвести поток
        с переданного `Last-Event-ID` (`unknown_last_event_id`). Получив его, клиент
        перечитывает все данные.
      operationId: stream
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: Журнал критических событий
      description: |
        Отдаёт сервис alerts. Общий для всех журнал критических событий базы по порогам по
        умолчанию: рост ожидаемой потери, крупный клиент в высоком риске, доля выручки под риском,
        рост числа клиентов высокого риска, данные без пересчёта. Поклиентских записей
        «перешёл в высокий риск» больше нет; `high_risk`, `loss_jump`, `total_loss_jump`, `bulk`
        остаются только у старых записей. Личные уведомления — `/api/v1/alerts/notifications`.
      operationId: listAlerts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: customer_id, in: query, schema: { type: integer, minimum: 1 } }
        - name: kind
          in: query
          schema: { type: string, enum: [loss_growth, big_customer_high, risk_share, high_count_growth, stale_data, high_risk, loss_jump, total_loss_jump, bulk] }
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/alerts/preferences:
    get:
      tags: [alerts]
      summary: Мои настройки уведомлений
      description: |
        Настройки текущего пользователя (по `X-User-Name`), каталог событий с порогами по умолчанию
        и состояние каналов. При первом обращении заводятся настройки по умолчанию: все критические
        события, кроме `stale_data`, только в панели.
      operationId: getAlertPreferences
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [alerts]
      summary: Сохранить мои настройки уведомлений
      description: Не переданные события получают значения по умолчанию. Для писем нужен `email`.
      operationId: putAlertPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertPreferencesInput' }
      responses:
        '200':
          description: Сохранённые настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPreferencesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/alerts/preferences/test:
    post:
      tags: [alerts]
      summary: Отправить тестовое уведомление
      description: Во все каналы, которые у пользователя есть (панель, почта, Telegram), без тихих часов и паузы.
      operationId: sendTestNotification
      responses:
        '200':
          description: Что ушло и что нет
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [channel, ok]
                      properties:
                        channel: { type: string, enum: [panel, email, telegram] }
                        ok: { type: boolean }
                        reason: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/alerts/preferences/users:
    get:
      tags: [alerts]
      summary: Настройки уведомлений всех пользователей (администратор)
      operationId: listAlertPreferences
      responses:
        '200':
          description: Кто что настроил
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AlertSubscriber' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/alerts/preferences/users/{username}:
    parameters:
      - { name: username, in: path, required: true, schema: { type: string } }
    get:
      tags: [alerts]
      summary: Настройки пользователя (администратор)
      operationId: getUserAlertPreferences
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPreferencesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [alerts]
      summary: Сбросить настройки пользователя к значениям по умолчанию (администратор)
      operationId: resetUserAlertPreferences
      responses:
        '204': { description: Сброшено }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/alerts/telegram/link:
    post:
      tags: [alerts]
      summary: Ссылка для привязки Telegram
      description: |
        Одноразовая deep link `https://t.me/<бот>?start=<код>`, код живёт 10 минут. Пользователь
        открывает её и нажимает Start — бот привязывает чат к аккаунту. 409, если бот не настроен.
      operationId: createTelegramLink
      responses:
        '200':
          description: Ссылка
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_in_s]
                properties:
                  url: { type: string }
                  expires_in_s: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'Бот не настроен (нет TELEGRAM_BOT_TOKEN)' }
    delete:
      tags: [alerts]
      summary: Отвязать Telegram
      operationId: deleteTelegramLink
      responses:
        '204': { description: Отвязано }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/alerts/notifications:
    get:
      tags: [alerts]
      summary: Мои уведомления (канал «в панели»)
      operationId: listMyNotifications
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: Последние уведомления и сколько непрочитанных
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationInbox' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/alerts/notifications/read:
    post:
      tags: [alerts]
      summary: Отметить мои уведомления прочитанными
      operationId: readMyNotifications
      responses:
        '204': { description: Готово }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/simulator:
    get:
      tags: [simulator]
      summary: Состояние демонстрационного потока изменений
      operationId: getSimulator
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [simulator]
      summary: Включить/выключить поток или сгенерировать расширенный набор
      operationId: putSimulator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatorCommand' }
      responses:
        '200':
          description: Новое состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics:
    get:
      tags: [ops]
      summary: Агрегированные метрики в формате Prometheus
      description: |
        Обязательные метрики:
        `churn_customers_by_risk_level{level="high|medium|low|unknown"}`,
        `churn_expected_loss_eur`, `churn_exposure_eur`, `churn_services_at_risk`,
        `churn_model_version`, `churn_last_scored_timestamp_seconds`.

        Риск-скор клиентов (те же числа, что `risk_scores` в `/api/v1/analytics/summary`):
        `churn_risk_score_avg`, `churn_risk_score_max`, `churn_risk_score_customers`,
        `churn_risk_score_bucket{le="10|20|…|100|+Inf"}` — снимок распределения на момент
        последнего пересчёта (gauge, накопленные корзины), а также доля выручки под риском
        `churn_revenue_at_risk_ratio`.

        Маркетинговые (те же числа, что в `/api/v1/analytics/marketing`, LTV уже с маржой):
        `churn_mrr_eur`, `churn_arpu_eur`, `churn_ltv_eur`, `churn_customer_churn_rate`,
        `churn_revenue_churn_rate` (прогноз на 30 дней, доли 0..1).
      operationId: metrics
      security:
        - metricsToken: []
      responses:
        '200':
          description: Текстовый формат экспозиции Prometheus
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/docs:
    get:
      tags: [ops]
      summary: Swagger UI с этой спецификацией
      operationId: docs
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cr_session
    bearerAuth:
      type: http
      scheme: bearer
    metricsToken:
      type: http
      scheme: bearer
      description: Статический токен сборщика метрик (`METRICS_TOKEN`)

  parameters:
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: |
        Тело можно сжать gzip. Лимиты задаются переменными ingest: `MAX_COMPRESSED_BODY_BYTES`
        (сжатое тело) и `MAX_BODY_BYTES` (после распаковки).
      schema: { type: string, enum: [gzip, identity] }

    ReasonFilter:
      name: reason
      in: query
      description: 'Код причины риска (как code в Reason): только клиенты с этой причиной'
      schema: { type: string, pattern: '^[a-z][a-z0-9_]{0,63}$', examples: [prolong_wait] }
    ReasonScope:
      name: reason_scope
      in: query
      description: '`main` — причина главная (первая в reasons), `any` — любая из причин клиента'
      schema: { type: string, enum: [main, any], default: any }
    ScoreMin:
      name: score_min
      in: query
      description: 'Риск не ниже (включительно)'
      schema: { type: number, minimum: 0, maximum: 100 }
    ScoreMax:
      name: score_max
      in: query
      description: 'Риск ниже (не включительно; 100 — включительно). Должен быть больше score_min'
      schema: { type: number, minimum: 0, maximum: 100 }

  responses:
    BadRequest:
      description: Тело не читается (например, повреждённый gzip)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Тело больше лимита (до или после распаковки)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Неподдерживаемый Content-Encoding
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет сессии или неверные учётные данные
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточно прав (нужна роль admin)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Слишком много попыток
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_credentials, not_found, validation_error] }
            message: { type: string, description: Сообщение по-русски для пользователя }
            details: { description: 'Детали, например поля с ошибками' }
            request_id: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 256 }

    User:
      type: object
      required: [id, username, display_name, roles, auth_method]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        roles:
          type: array
          items: { type: string, enum: [admin, marketer, analyst] }
        auth_method: { type: string, enum: [password, oidc, saml] }
        email:
          type: [string, 'null']
          description: Адрес для уведомлений; задаёт сам пользователь в профиле, админ или SSO

    ManagedUser:
      type: object
      required: [id, username, display_name, email, role, status, source, has_password, created_at, last_login_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        email: { type: [string, 'null'] }
        role: { type: string, enum: [admin, marketer, analyst] }
        status: { type: string, enum: [active, blocked] }
        source:
          type: string
          enum: [password, oidc, saml, sso]
          description: '`sso` — заведён «только для SSO» и ещё ни разу не входил'
        has_password: { type: boolean }
        created_at: { type: [string, 'null'], format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }

    UserCreate:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]*$' }
        display_name: { type: string, maxLength: 128 }
        email: { type: [string, 'null'], maxLength: 254 }
        role: { type: string, enum: [admin, marketer, analyst], default: analyst }
        password: { type: [string, 'null'], minLength: 8, maxLength: 256 }
        sso_only: { type: boolean, default: false }

    UserUpdate:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 128 }
        email: { type: [string, 'null'], maxLength: 254 }
        role: { type: string, enum: [admin, marketer, analyst] }
        status: { type: string, enum: [active, blocked] }

    AuditEntry:
      type: object
      required: [id, actor, action, target, details, created_at]
      properties:
        id: { type: integer }
        actor: { type: string }
        action:
          type: string
          examples: [user.create, user.update, user.role, user.block, user.unblock, user.password_reset, user.delete]
        target: { type: [string, 'null'] }
        details: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }

    RiskLevel:
      type: string
      enum: [high, medium, low, unknown]
      description: '`unknown` — данных недостаточно, оценки нет'

    PaymentTerm:
      type: string
      enum: [hour, week, month, quarter_year, half_year, year]

    ServiceStatus:
      type: string
      enum: [active, suspended, prolong_wait, deleted, blocked]

    Reason:
      type: object
      required: [code, title, contribution]
      properties:
        code: { type: string, description: Код признака из реестра модели, examples: [autoprolong_off_expiring] }
        title: { type: string, description: Объяснение по-русски для маркетолога }
        label:
          type: string
          description: 'Короткое название причины (название признака, для «нет оценки» — короткая подпись): для таблиц и списков, где длинный title не помещается'
          examples: [Не хватит денег на продление]
        contribution: { type: number, description: 'Вклад в score, пунктов из 100' }
        service_id: { type: [integer, 'null'], format: int64, description: 'К какой услуге относится, если относится' }
        action: { type: string, description: 'Что сделать маркетологу по этой причине, коротко и с цифрами из данных' }
        expected_loss: { type: integer, description: 'Сколько ожидаемых потерь за горизонт приходится на эту причину, евроценты' }

    Recommendation:
      type: object
      required: [code, title]
      properties:
        code: { type: string, description: 'Код признака, от которого идёт действие, или код действия для клиентов без оценки' }
        title: { type: string, description: Действие коротко }
        detail: { type: string, description: Подробности и цифры }
        service_id: { type: [integer, 'null'], format: int64, description: 'К какой услуге относится действие, если относится' }
        expected_saving:
          type: integer
          description: 'На сколько снизится ожидаемая потеря за горизонт, если причина исчезнет, евроценты'
        primary: { type: boolean, description: 'Главное действие по клиенту (наибольший денежный эффект)' }

    Money:
      type: object
      required: [monthly_revenue, exposure, expected_loss, explanation]
      properties:
        monthly_revenue: { type: integer, description: 'Выручка с живых услуг клиента, приведённая к месяцу, евроценты' }
        horizon_revenue: { type: integer, description: 'Выручка с живых услуг за горизонт, по которой взвешивается score, евроценты' }
        exposure: { type: integer, description: 'Максимум, что можно потерять за горизонт, если уйдут все услуги под риском, евроценты' }
        expected_loss: { type: integer, description: 'Ожидаемая потеря за горизонт с учётом вероятности и покрытия балансом, евроценты' }
        balance_coverage_days:
          type: [number, 'null']
          description: >-
            На сколько дней хватит баланса и разблокированных бонусов на автопродления по их
            фактическому графику (тот же расчёт, что дата в причине insufficient_funds). null —
            платных автопродлений нет или денег на них хватит больше чем на год (см. explanation)
        funds_run_out_at:
          type: [string, 'null']
          format: date-time
          description: 'Когда баланса не хватит на очередное автопродление; null — в пределах года не кончится или автопродлений нет'
        explanation: { type: string }

    CustomerSummary:
      type: object
      required: [id, email, balance, bonus_balance, withdraw_balance, total_replenished, risk_score, risk_level, loyalty, reasons, services_total, services_at_risk, monthly_revenue, expected_loss, exposure]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        balance: { type: integer, description: евроценты }
        bonus_balance: { type: integer, description: евроценты }
        bonus_state: { type: string, enum: [locked, unlocked] }
        withdraw_balance: { type: integer, description: евроценты }
        total_replenished: { type: integer, description: евроценты }
        risk_score: { type: [number, 'null'], minimum: 0, maximum: 100 }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        loyalty: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Обратная шкала: 100 − risk_score' }
        reasons:
          type: array
          description: Причины по убыванию вклада. Для unknown — причина отсутствия оценки (contribution = 0).
          items: { $ref: '#/components/schemas/Reason' }
        services_total: { type: integer }
        services_at_risk: { type: integer }
        monthly_revenue: { type: integer, description: евроценты }
        expected_loss: { type: integer, description: евроценты }
        exposure: { type: integer, description: евроценты }

    CustomerPage:
      type: object
      required: [items, total, page, page_size, scored_at, model_version]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSummary' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    CustomerAction:
      type: object
      required: [status, until, note, updated_at, updated_by, expected_loss_at_mark, risk_level_at_mark, active, return_reason]
      description: |
        Жизненный цикл: «Письмо отправлено» (emailed) держит клиента вне очереди, пока ждём ответа;
        «Решено» (resolved) — пока риск не вырастет; «Отложено» (snoozed) — до даты.
      properties:
        status: { type: string, enum: [emailed, resolved, snoozed] }
        until: { type: [string, 'null'], format: date-time, description: 'До какого момента клиент не показывается в очереди; null для resolved' }
        note: { type: [string, 'null'], description: 'Комментарий; для письма — его тема' }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }
        expected_loss_at_mark: { type: integer, description: 'Ожидаемая потеря в момент отметки, евроценты' }
        risk_level_at_mark: { $ref: '#/components/schemas/RiskLevel' }
        active: { type: boolean, description: 'Отметка сейчас прячет клиента из очереди' }
        return_reason:
          type: [string, 'null']
          enum: [risk_grew, no_reply, snooze_over, null]
          description: 'Почему клиент снова в очереди: риск вырос, на письмо не ответили за срок, отложка кончилась'

    CustomerActionUpdate:
      type: object
      additionalProperties: false
      required: [status]
      description: >-
        snoozed — ровно одно из snooze_days и snoozed_until; emailed — срок ожидания ответа
        (по умолчанию MAIL_FOLLOWUP_DAYS, 7 дней); resolved — без срока
      properties:
        status: { type: string, enum: [emailed, resolved, snoozed] }
        snooze_days: { type: integer, minimum: 1, maximum: 365 }
        snoozed_until: { type: string, format: date-time, description: 'В будущем, не дальше чем через 365 дней' }
        note: { type: string, maxLength: 500 }

    CustomerActionLogEntry:
      type: object
      required: [status, until, note, expected_loss, email_id, changed_at, changed_by]
      properties:
        status: { type: string, enum: [emailed, resolved, snoozed, cleared] }
        until: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], description: 'Комментарий; для письма — тема' }
        expected_loss: { type: [integer, 'null'], description: 'Ожидаемая потеря клиента в момент записи, евроценты' }
        email_id: { type: [integer, 'null'], format: int64, description: 'Письмо, после которого появилась запись' }
        changed_at: { type: string, format: date-time }
        changed_by: { type: [string, 'null'] }

    CustomerActionState:
      type: object
      required: [customer_id, action, history]
      properties:
        customer_id: { type: integer, format: int64 }
        action:
          oneOf:
            - { $ref: '#/components/schemas/CustomerAction' }
            - { type: 'null' }
        history:
          type: array
          description: Журнал от новых записей к старым
          items: { $ref: '#/components/schemas/CustomerActionLogEntry' }

    ContactTodayItem:
      type: object
      required: [id, email, risk_level, risk_score, expected_loss, main_reason, main_reason_code, next_action, action]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        risk_score: { type: [number, 'null'], minimum: 0, maximum: 100 }
        expected_loss: { type: integer, description: евроценты }
        main_reason: { type: [string, 'null'], description: Короткое название главной причины риска }
        main_reason_code: { type: [string, 'null'], description: Код главной причины — по нему выбирается шаблон письма }
        next_action:
          description: Главное действие из карточки клиента
          oneOf:
            - { $ref: '#/components/schemas/Recommendation' }
            - { type: 'null' }
        action:
          oneOf:
            - { $ref: '#/components/schemas/CustomerAction' }
            - { type: 'null' }

    ContactToday:
      type: object
      required: [items, queue_total, queue_expected_loss, marked_total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactTodayItem' }
        queue_total: { type: integer, description: Сколько клиентов в очереди всего (без отмеченных) }
        queue_expected_loss: { type: integer, description: Ожидаемая потеря по всей очереди, евроценты }
        marked_total: { type: integer, description: Сколько клиентов сейчас спрятано отметками }

    MailTemplate:
      type: object
      required: [code, title, subject, body, is_default, updated_at, updated_by]
      properties:
        code:
          type: string
          description: 'Код причины риска, к которой относится шаблон, или general / win_back'
          examples: [insufficient_funds]
        title: { type: string, description: 'Название для панели' }
        subject: { type: string, description: 'Тема с подстановками {{…}}' }
        body: { type: string, description: 'Текст с подстановками {{…}}' }
        is_default: { type: boolean, description: 'Текст совпадает с исходным' }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }

    MailTemplatePatch:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }

    MailTemplates:
      type: object
      required: [items, placeholders]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MailTemplate' }
        placeholders:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string, examples: [service] }
              description: { type: string }

    EmailDraftRequest:
      type: object
      additionalProperties: false
      properties:
        template_code: { type: [string, 'null'], description: 'Не указан — шаблон по главной причине риска' }

    EmailDraft:
      type: object
      required: [customer_id, to, reply_to, from, template_code, subject, text, last_sent_at, enabled]
      properties:
        customer_id: { type: integer, format: int64 }
        to: { type: string }
        reply_to: { type: string, description: 'Куда придёт ответ клиента: почта сотрудника, SMTP_REPLY_TO или SMTP_FROM' }
        from: { type: string }
        template_code: { type: string }
        subject: { type: string }
        text: { type: string }
        last_sent_at: { type: [string, 'null'], format: date-time, description: 'Когда клиенту писали в последний раз' }
        enabled: { type: boolean, description: 'Настроена ли отправка (SMTP_HOST)' }

    EmailSendRequest:
      type: object
      additionalProperties: false
      required: [subject, text]
      properties:
        template_code: { type: [string, 'null'] }
        subject: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, minLength: 1, maxLength: 10000, description: 'Оставшиеся подстановки {{…}} заполнятся при отправке' }

    CustomerEmail:
      type: object
      required: [id, customer_id, campaign_id, to, reply_to, template_code, subject, status, skip_reason, error, created_at, created_by, sent_at]
      properties:
        id: { type: integer, format: int64 }
        customer_id: { type: integer, format: int64 }
        campaign_id: { type: [integer, 'null'], format: int64 }
        to: { type: string }
        reply_to: { type: [string, 'null'] }
        template_code: { type: [string, 'null'] }
        subject: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, skipped] }
        skip_reason: { type: [string, 'null'], enum: [recent, no_email, null] }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }

    EmailSent:
      type: object
      required: [email, state]
      properties:
        email: { $ref: '#/components/schemas/CustomerEmail' }
        state: { $ref: '#/components/schemas/CustomerActionState' }

    CampaignRequest:
      type: object
      additionalProperties: false
      description: 'Кому писать: выбранным (customer_ids), всей очереди (worklist: true) или всем с причиной риска (reason) — что-то одно'
      properties:
        customer_ids:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: integer, format: int64 }
        worklist: { type: boolean, default: false }
        reason:
          type: [string, 'null']
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: 'Всем клиентам с этой причиной (до 5000, самые дорогие по ожидаемой потере первыми)'
        reason_scope: { type: string, enum: [main, any], default: any, description: 'Как у фильтра списка клиентов' }
        template_code: { type: [string, 'null'], description: 'Один шаблон для всех; не указан — по главной причине каждого клиента' }
        skip_days:
          type: integer
          minimum: 0
          maximum: 90
          default: 7
          description: 'Не писать тем, кому уже писали за столько дней (0 — писать всем)'

    CampaignPreview:
      type: object
      required: [total, to_send, skipped_recent, skipped_no_email, not_found, templates, sample, enabled]
      properties:
        total: { type: integer }
        to_send: { type: integer }
        skipped_recent: { type: integer, description: 'Писали недавно (skip_days)' }
        skipped_no_email: { type: integer }
        not_found: { type: integer, description: 'Таких id нет среди оценённых клиентов' }
        templates:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer }
        sample:
          description: Первое письмо рассылки, как его увидит клиент
          oneOf:
            - type: object
              required: [customer_id, to, template_code, subject, text]
              properties:
                customer_id: { type: integer, format: int64 }
                to: { type: string }
                template_code: { type: string }
                subject: { type: string }
                text: { type: string }
            - { type: 'null' }
        enabled: { type: boolean }

    Campaign:
      type: object
      required: [id, template_code, skip_days, created_at, created_by, finished_at, status, total, queued, sending, sent, failed, skipped]
      properties:
        id: { type: integer, format: int64 }
        template_code: { type: [string, 'null'] }
        skip_days: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }
        finished_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [running, done] }
        total: { type: integer }
        queued: { type: integer }
        sending: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }

    MailStats:
      type: object
      required: [period_days, sent, failed, queued, customers, risk_down, topped_up, helped, helped_share]
      description: |
        Помогло ли письмо: у клиента после последнего письма за период снизился risk-score
        или вырос баланс (по последующим данным). Простая оценка: она не отделяет эффект
        письма от того, что клиент сделал бы и сам.
      properties:
        period_days: { type: integer }
        sent: { type: integer, description: 'Писем отправлено за период' }
        failed: { type: integer }
        queued: { type: integer, description: 'Ждут отправки в рассылках' }
        customers: { type: integer, description: 'Скольким клиентам писали' }
        risk_down: { type: integer }
        topped_up: { type: integer }
        helped: { type: integer, description: 'risk_down или topped_up' }
        helped_share: { type: [number, 'null'], minimum: 0, maximum: 1 }

    PlaybookConditions:
      type: object
      additionalProperties: false
      description: Заданные условия должны выполняться все сразу; хотя бы одно обязательно.
      properties:
        risk_levels:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RiskLevel' }
        became_high: { type: boolean, description: 'Уровень стал high с прошлого пересчёта' }
        main_reason: { type: string, description: 'Код главной причины риска', examples: [insufficient_funds] }
        min_expected_loss: { type: integer, minimum: 0, description: 'Ожидаемая потеря не меньше, евроценты' }
        no_email_days: { type: integer, minimum: 1, maximum: 365, description: 'Клиенту не писали столько дней' }
        min_mrr: { type: integer, minimum: 0, description: 'Месячная выручка от, евроценты' }
        max_mrr: { type: integer, minimum: 0, description: 'Месячная выручка до, евроценты' }
        autoprolong_off: { type: boolean, description: 'У действующей услуги выключено автопродление' }
        expires_within_days: { type: integer, minimum: 0, maximum: 90, description: 'Ближайшее списание не позже чем через N дней' }

    PlaybookAction:
      type: object
      required: [type]
      description: |
        email — письмо по шаблону (template_code null — по главной причине клиента) через очередь рассылки;
        status — поставить статус (snoozed на days дней или resolved);
        notify — уведомление пользователю панели username в колокольчик, одно на запуск.
      properties:
        type: { type: string, enum: [email, status, notify] }
        template_code: { type: [string, 'null'] }
        status: { type: string, enum: [snoozed, resolved] }
        days: { type: integer, minimum: 1, maximum: 365 }
        username: { type: string, minLength: 1, maxLength: 64 }

    PlaybookInput:
      type: object
      additionalProperties: false
      required: [name, conditions, actions]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        enabled: { type: boolean, default: false }
        mode: { type: string, enum: [simulation, live], default: simulation }
        conditions: { $ref: '#/components/schemas/PlaybookConditions' }
        actions:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/PlaybookAction' }
        control_share: { type: number, minimum: 0, maximum: 0.5, default: 0.2, description: 'Доля контрольной группы' }
        max_per_day: { type: integer, minimum: 1, maximum: 5000, default: 50, description: 'Сколько клиентов в день получают действие' }
        cooldown_days: { type: integer, minimum: 1, maximum: 365, default: 14, description: 'Не чаще раза в K дней на клиента' }
        preset: { type: [string, 'null'], description: 'Код готового сценария, из которого создан' }

    Playbook:
      type: object
      required: [id, name, description, enabled, mode, conditions, actions, control_share, max_per_day, cooldown_days, preset, created_at, created_by, updated_at, updated_by, last_run_at, stats]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: [string, 'null'] }
        enabled: { type: boolean }
        mode: { type: string, enum: [simulation, live] }
        conditions: { $ref: '#/components/schemas/PlaybookConditions' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/PlaybookAction' }
        control_share: { type: number }
        max_per_day: { type: integer }
        cooldown_days: { type: integer }
        preset: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }
        last_run_at: { type: [string, 'null'], format: date-time }
        stats:
          type: object
          required: [treated, control, emails]
          properties:
            treated: { type: integer }
            control: { type: integer }
            emails: { type: integer }

    PlaybookPreset:
      type: object
      required: [code, name, description, conditions, actions]
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        conditions: { $ref: '#/components/schemas/PlaybookConditions' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/PlaybookAction' }

    PlaybookList:
      type: object
      required: [items, presets, reasons, mail_enabled]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Playbook' }
        presets:
          type: array
          items: { $ref: '#/components/schemas/PlaybookPreset' }
        reasons:
          type: array
          items:
            type: object
            required: [code, title]
            properties:
              code: { type: string }
              title: { type: string }
        mail_enabled: { type: boolean, description: 'Настроен ли SMTP: без него действие «письмо» пропускается' }

    PlaybookSample:
      type: object
      required: [customer_id, email, risk_level, expected_loss, main_reason, group]
      properties:
        customer_id: { type: integer, format: int64 }
        email: { type: string }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        expected_loss: { type: integer }
        main_reason: { type: [string, 'null'] }
        group: { type: string, enum: [treated, control] }

    PlaybookPreview:
      type: object
      required: [matched, treated, control, skipped_cooldown, skipped_limit, skipped_no_email, sample, levels_ready]
      properties:
        matched: { type: integer, description: 'Подходят под условия' }
        treated: { type: integer, description: 'Получат действие' }
        control: { type: integer, description: 'В контрольной группе: учитываются, но действие не выполняется' }
        skipped_cooldown: { type: integer, description: 'Сценарий уже срабатывал на них за cooldown_days' }
        skipped_limit: { type: integer, description: 'Не вошли в дневной лимит' }
        skipped_no_email: { type: integer }
        sample:
          type: array
          description: 'До 20 клиентов с наибольшей ожидаемой потерей'
          items: { $ref: '#/components/schemas/PlaybookSample' }
        levels_ready: { type: boolean, description: 'false — уровни с прошлого пересчёта ещё не запомнены, «стал high» пока не сработает' }

    PlaybookRunResult:
      type: object
      required: [run_id, mode, emails, matched, treated, control, skipped_cooldown, skipped_limit, skipped_no_email, sample]
      properties:
        run_id: { type: [integer, 'null'], format: int64 }
        mode: { type: string, enum: [simulation, live] }
        emails: { type: integer, description: 'Писем поставлено в очередь' }
        matched: { type: integer }
        treated: { type: integer }
        control: { type: integer }
        skipped_cooldown: { type: integer }
        skipped_limit: { type: integer }
        skipped_no_email: { type: integer }
        sample:
          type: array
          items: { $ref: '#/components/schemas/PlaybookSample' }

    PlaybookRun:
      type: object
      required: [id, cause, mode, matched, treated, control, skipped_cooldown, skipped_limit, skipped_no_email, emails, created_at, created_by]
      properties:
        id: { type: integer, format: int64 }
        cause: { type: string, enum: [scores, manual], description: 'scores — после пересчёта, manual — из панели' }
        mode: { type: string, enum: [simulation, live] }
        matched: { type: integer }
        treated: { type: integer }
        control: { type: integer }
        skipped_cooldown: { type: integer }
        skipped_limit: { type: integer }
        skipped_no_email: { type: integer }
        emails: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }

    PlaybookHit:
      type: object
      required: [id, run_id, customer_id, email, group, risk_level, expected_loss, actions, email_id, email_status, hit_at]
      properties:
        id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        customer_id: { type: integer, format: int64 }
        email: { type: [string, 'null'] }
        group: { type: string, enum: [treated, control] }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        expected_loss: { type: integer, description: 'На момент срабатывания, евроценты' }
        actions:
          type: array
          items:
            type: object
            required: [type, result]
            properties:
              type: { type: string, enum: [email, status, notify] }
              result: { type: string, description: 'queued, done, mail_disabled, no_email, not_found' }
        email_id: { type: [integer, 'null'], format: int64 }
        email_status: { type: [string, 'null'], description: 'queued, sending, sent, failed' }
        hit_at: { type: string, format: date-time }

    PlaybookUpliftMetric:
      type: object
      required: [code, title, treated, control, treated_share, control_share, diff, ci_low, ci_high, verdict]
      properties:
        code: { type: string, enum: [retained, risk_down, topped_up] }
        title: { type: string }
        treated: { type: integer }
        control: { type: integer }
        treated_share: { type: [number, 'null'] }
        control_share: { type: [number, 'null'] }
        diff: { type: [number, 'null'] }
        ci_low: { type: [number, 'null'] }
        ci_high: { type: [number, 'null'] }
        verdict: { type: string, enum: [few_data, better, worse, no_effect] }

    PlaybookUpliftWindow:
      type: object
      required: [days, treated_n, control_n, enough, metrics, summary]
      properties:
        days: { type: integer, description: '0, 7, 14 или 30' }
        treated_n: { type: integer }
        control_n: { type: integer }
        enough: { type: boolean }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/PlaybookUpliftMetric' }
        summary: { type: string, description: 'Вывод одной фразой' }

    PlaybookUplift:
      type: object
      required: [playbook_id, min_group, windows]
      properties:
        playbook_id: { type: integer, format: int64 }
        min_group: { type: integer, description: 'Меньше стольких клиентов в группе — мало данных' }
        windows:
          type: array
          items: { $ref: '#/components/schemas/PlaybookUpliftWindow' }

    ServiceRisk:
      type: object
      required: [id, name, status, payment_term, price, auto_prolong, created_at, expires_at, risk_score, risk_level, reasons, expected_loss, monthly_price]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        payment_term: { $ref: '#/components/schemas/PaymentTerm' }
        price: { type: integer, description: 'Цена за период оплаты, евроценты' }
        monthly_price: { type: integer, description: 'Цена, приведённая к месяцу, евроценты' }
        auto_prolong: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        days_to_expiry: { type: [number, 'null'], description: 'Отрицательное — уже истекла' }
        risk_score: { type: [number, 'null'] }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/Reason' }
        expected_loss: { type: integer, description: евроценты }
        horizon_revenue:
          type: integer
          description: 'Выручка услуги за горизонт, которую реально можно получить: по цене, но не больше, чем клиент способен заплатить; евроценты'
        revenue_note:
          type: [string, 'null']
          description: 'Пояснение, если выручку ограничила платёжеспособность клиента'

    FeatureContribution:
      type: object
      required: [code, title, group, value, weight, contribution, explanation]
      properties:
        code: { type: string }
        title: { type: string }
        group: { type: string }
        value: { type: number, minimum: 0, maximum: 1, description: 'Сила сигнала 0..1' }
        weight: { type: number, description: 'Действующий коэффициент' }
        contribution: { type: number, description: 'Вклад в итоговый score, пунктов' }
        explanation: { type: string }

    Transaction:
      type: object
      required: [id, type, status, amount, created_at, service_id]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [prolong, order] }
        status: { type: string, enum: [performed, not_performed] }
        amount: { type: integer, description: евроценты }
        created_at: { type: string, format: date-time }
        performed_at: { type: [string, 'null'], format: date-time }
        service_id: { type: integer, format: int64 }

    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/CustomerSummary'
        - type: object
          required: [services, features, transactions, money, recommendations, scored_at, model_version]
          properties:
            services:
              type: array
              items: { $ref: '#/components/schemas/ServiceRisk' }
            features:
              type: array
              description: Разложение score по признакам
              items: { $ref: '#/components/schemas/FeatureContribution' }
            transactions:
              type: array
              description: Последние транзакции (до 50), от новых к старым
              items: { $ref: '#/components/schemas/Transaction' }
            money: { $ref: '#/components/schemas/Money' }
            recommendations:
              type: array
              description: 'Что предпринять маркетологу, по убыванию денежного эффекта; первое — главное'
              items: { $ref: '#/components/schemas/Recommendation' }
            next_action:
              description: 'Одно главное действие по клиенту (то же, что первое в recommendations)'
              anyOf:
                - $ref: '#/components/schemas/Recommendation'
                - type: 'null'
            marketing:
              description: 'Маркетинговые показатели клиента; null — оценка посчитана до появления блока'
              anyOf:
                - $ref: '#/components/schemas/CustomerMarketing'
                - type: 'null'
            scored_at: { type: [string, 'null'], format: date-time }
            model_version: { type: integer }

    CustomerMarketing:
      type: object
      description: 'Маркетинговые показатели клиента. Месяц — 30 дней, деньги — евроценты'
      required: [mrr, monthly_churn, expected_lifetime_months, lifetime_capped, ltv_forecast, ltv_fact, payments, tenure_days]
      properties:
        mrr: { type: integer, description: 'Выручка действующих услуг в месяц (та же, что money.monthly_revenue)' }
        monthly_churn: { type: [number, 'null'], minimum: 0, maximum: 1, description: 'Вероятность ухода за 30 дней: risk_score / 100, пересчитанный с горизонта на месяц; null — нет оценки' }
        expected_lifetime_months: { type: [number, 'null'], description: 'Сколько месяцев ещё ожидаем: 1 / monthly_churn, не больше 60' }
        lifetime_capped: { type: boolean, description: 'Срок упёрся в потолок 60 месяцев' }
        ltv_forecast: { type: integer, description: 'Сколько клиент ещё принесёт: mrr × маржа × expected_lifetime_months' }
        ltv_fact: { type: integer, description: 'Сколько уже принёс: сумма проведённых транзакций за услуги' }
        payments: { type: integer, description: 'Число проведённых ненулевых платежей' }
        avg_check: { type: [integer, 'null'], description: 'Средний платёж клиента' }
        first_seen: { type: [string, 'null'], format: date-time, description: 'Первая услуга или транзакция' }
        tenure_days: { type: [number, 'null'], description: 'Сколько дней с нами: от first_seen до опорного момента или до ухода' }
        left_at: { type: [string, 'null'], format: date-time, description: 'Когда ушёл (все услуги удалены или заблокированы; оценка по окончанию оплаты + 5 дней); null — ещё с нами' }
        margin: { type: number, description: 'Маржа, с которой посчитан ltv_forecast (из настроек маркетинга)' }

    MarketingSettings:
      type: object
      required: [margin, cac, updated_at, updated_by]
      properties:
        margin: { type: number, minimum: 0.01, maximum: 1, description: 'Доля выручки, которая остаётся прибылью; 1 — LTV в выручке' }
        cac: { type: [integer, 'null'], minimum: 1, description: 'Стоимость привлечения одного клиента, евроценты; null — не задана' }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'] }

    MarketingSettingsUpdate:
      type: object
      additionalProperties: false
      required: [margin]
      properties:
        margin: { type: number, minimum: 0.01, maximum: 1 }
        cac: { type: [integer, 'null'], minimum: 1, maximum: 100000000, description: 'евроценты; null — сбросить' }

    MarketingSegment:
      type: object
      required: [level, customers, mrr, arpu, monthly_churn, ltv, ltv_avg, expected_mrr_loss]
      properties:
        level: { $ref: '#/components/schemas/RiskLevel' }
        customers: { type: integer }
        mrr: { type: integer }
        arpu: { type: integer, description: 'MRR сегмента на платящего клиента' }
        monthly_churn: { type: [number, 'null'], description: 'Средняя вероятность ухода за 30 дней по платящим клиентам сегмента' }
        ltv: { type: integer, description: 'Сумма прогнозных LTV клиентов сегмента (с маржой)' }
        ltv_avg: { type: integer, description: 'Средний LTV платящего клиента сегмента' }
        expected_mrr_loss: { type: integer, description: 'Сколько MRR ожидаем потерять за 30 дней' }

    RetentionScenario:
      type: object
      description: 'Что будет, если удержать клиентов этих уровней: их отток вернётся к target_monthly_churn'
      required: [levels, customers, mrr, ltv_now, ltv_retained, ltv_uplift, saved_mrr, target_monthly_churn, target_source]
      properties:
        levels: { type: array, items: { $ref: '#/components/schemas/RiskLevel' } }
        customers: { type: integer }
        mrr: { type: integer }
        ltv_now: { type: integer, description: 'Сумма LTV этих клиентов сейчас' }
        ltv_retained: { type: [integer, 'null'], description: 'Сумма LTV, если удержим' }
        ltv_uplift: { type: [integer, 'null'], description: 'На сколько вырастет LTV базы' }
        saved_mrr: { type: [integer, 'null'], description: 'Сколько MRR в месяц перестанем терять' }
        target_monthly_churn: { type: [number, 'null'] }
        target_source:
          type: string
          enum: [fact, low_risk, none]
          description: 'fact — фактический отток по истории; low_risk — отток клиентов низкого риска; none — не с чем сравнить, сценарий не посчитан'

    Marketing:
      type: object
      required: [horizon_days, customers_total, active_customers, paying_customers, mrr, arpu, arppu, churn, retention, lifetime, ltv, ltv_total, ltv_at_risk, ltv_fact, concentration, auto_prolong, payment_terms, segments, retention_scenarios, unit_economics, settings, scored_at, model_version]
      properties:
        horizon_days: { type: integer }
        customers_total: { type: integer, description: 'Все клиенты в снимке, включая ушедших' }
        active_customers: { type: integer, description: 'С хотя бы одной действующей услугой' }
        paying_customers: { type: integer, description: 'С MRR больше нуля (и оценкой риска)' }
        mrr: { type: integer, description: 'Месячная регулярная выручка, евроценты (совпадает с monthly_revenue_total сводки)' }
        arpu: { type: integer, description: 'MRR / active_customers' }
        arppu: { type: integer, description: 'MRR / paying_customers' }
        churn:
          type: object
          required: [customer_horizon, customer_monthly, revenue_horizon, revenue_monthly, expected_customers_lost, expected_mrr_loss, fact]
          properties:
            customer_horizon: { type: [number, 'null'], description: 'Прогноз: доля платящих клиентов, которые уйдут за горизонт' }
            customer_monthly: { type: [number, 'null'], description: 'То же за 30 дней' }
            revenue_horizon: { type: [number, 'null'], description: 'Прогноз: доля выручки, которая уйдёт за горизонт' }
            revenue_monthly: { type: [number, 'null'], description: 'Gross revenue churn за 30 дней' }
            expected_customers_lost: { type: number, description: 'Сколько клиентов ожидаем потерять за 30 дней' }
            expected_mrr_loss: { type: integer, description: 'Сколько MRR ожидаем потерять за 30 дней' }
            fact:
              type: object
              description: 'Факт по истории: ушедшие клиенты / клиенто-месяцы наблюдения'
              required: [customers_observed, customers_left, exposure_months, monthly_churn, avg_tenure_months, avg_lifetime_left_months]
              properties:
                customers_observed: { type: integer }
                customers_left: { type: integer }
                exposure_months: { type: number }
                monthly_churn: { type: [number, 'null'] }
                avg_tenure_months: { type: [number, 'null'], description: 'Средний срок с нами по всем клиентам' }
                avg_lifetime_left_months: { type: [number, 'null'], description: 'Сколько в среднем прожили ушедшие' }
        retention:
          type: object
          required: [customer_monthly, revenue_monthly]
          properties:
            customer_monthly: { type: [number, 'null'], description: '1 − churn.customer_monthly' }
            revenue_monthly: { type: [number, 'null'], description: '1 − churn.revenue_monthly' }
        lifetime:
          type: object
          required: [expected_months, capped, cap_months, fact_avg_months]
          properties:
            expected_months: { type: [number, 'null'], description: '1 / churn.customer_monthly' }
            capped: { type: boolean }
            cap_months: { type: number }
            fact_avg_months: { type: [number, 'null'] }
        ltv: { type: integer, description: 'LTV среднего клиента: ARPU × маржа × expected_months' }
        ltv_total: { type: integer, description: 'Сумма прогнозных LTV всех клиентов' }
        ltv_at_risk: { type: integer, description: 'Сумма LTV клиентов высокого и среднего риска' }
        ltv_fact:
          type: object
          required: [total, avg_per_customer, payments, avg_check]
          properties:
            total: { type: integer, description: 'Сумма проведённых транзакций за услуги' }
            avg_per_customer: { type: integer }
            payments: { type: integer, description: 'Проведённые ненулевые платежи' }
            avg_check: { type: [integer, 'null'], description: 'Средний платёж' }
        concentration:
          type: object
          required: [top_customers, top_share]
          properties:
            top_customers: { type: integer, description: 'Сколько клиентов — топ-10% платящих по MRR (не меньше одного)' }
            top_share: { type: [number, 'null'], description: 'Их доля в MRR' }
        auto_prolong:
          type: object
          required: [customers, customers_share, mrr_share]
          properties:
            customers: { type: integer, description: 'Активные клиенты, у которых есть услуга на автопродлении' }
            customers_share: { type: [number, 'null'] }
            mrr_share: { type: [number, 'null'], description: 'Доля MRR с услуг на автопродлении' }
        payment_terms:
          type: array
          items:
            type: object
            required: [term, services, mrr, share]
            properties:
              term: { $ref: '#/components/schemas/PaymentTerm' }
              services: { type: integer, description: 'Действующие услуги' }
              mrr: { type: integer }
              share: { type: [number, 'null'] }
        segments:
          type: array
          items: { $ref: '#/components/schemas/MarketingSegment' }
        retention_scenarios:
          type: array
          items: { $ref: '#/components/schemas/RetentionScenario' }
        unit_economics:
          type: object
          required: [margin, cac, ltv_cac, payback_months]
          properties:
            margin: { type: number }
            cac: { type: [integer, 'null'] }
            ltv_cac: { type: [number, 'null'], description: 'LTV / CAC; null — CAC не задан' }
            payback_months: { type: [number, 'null'], description: 'CAC / (ARPU × маржа); null — CAC не задан' }
        settings: { $ref: '#/components/schemas/MarketingSettings' }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    TimelinePoint:
      type: object
      required: [date, kind]
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [fact, forecast] }
        deletions: { type: [integer, 'null'], description: 'Факт: удалённые услуги за день' }
        estimated_deletions: { type: [integer, 'null'], description: 'Факт: сколько из deletions датированы оценкой (услуга пришла в снимке уже удалённой, дата = окончание оплаты + 5 дней)' }
        at_risk_services: { type: [integer, 'null'], description: 'Услуги под риском (high+medium) на дату. В зоне факта известно только на день снимка, в прочие дни null' }
        expected_nonrenewals: { type: [number, 'null'], description: 'Прогноз: ожидаемое число непродлений за день' }
        expected_loss: { type: [integer, 'null'], description: 'Прогноз: ожидаемая потеря за день, евроценты' }

    LevelCounts:
      type: object
      required: [high, medium, low, unknown]
      properties:
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        unknown: { type: integer }

    RiskDistribution:
      type: object
      required: [buckets, levels, scored_at, model_version]
      properties:
        buckets:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: object
            required: [from, to, customers, expected_loss, by_level]
            properties:
              from: { type: number, description: 'Нижняя граница score, включительно' }
              to: { type: number, description: 'Верхняя граница, не включительно (у последней корзины — включительно)' }
              customers: { type: integer }
              expected_loss: { type: integer, description: евроценты }
              by_level:
                type: object
                required: [high, medium, low]
                properties:
                  high: { type: integer }
                  medium: { type: integer }
                  low: { type: integer }
        levels:
          type: array
          items:
            type: object
            required: [level, customers, monthly_revenue, expected_loss]
            properties:
              level: { $ref: '#/components/schemas/RiskLevel' }
              customers: { type: integer }
              monthly_revenue: { type: integer, description: 'Выручка в месяц, евроценты' }
              expected_loss: { type: integer, description: 'Ожидаемая потеря за горизонт, евроценты' }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    RiskScatter:
      type: object
      required: [points, total, shown, scored_at, model_version]
      properties:
        points:
          type: array
          maxItems: 400
          items:
            type: object
            required: [id, email, risk_score, risk_level, expected_loss, monthly_revenue]
            properties:
              id: { type: integer, format: int64 }
              email: { type: string }
              risk_score: { type: number, minimum: 0, maximum: 100 }
              risk_level: { $ref: '#/components/schemas/RiskLevel' }
              expected_loss: { type: integer, description: евроценты }
              monthly_revenue: { type: integer, description: 'MRR клиента, евроценты' }
        total: { type: integer, description: 'Сколько клиентов с оценкой подходит под фильтры' }
        shown: { type: integer }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    ReasonDetail:
      type: object
      required: [code, scope, title, plain, description, group, customers, primary_customers, monthly_revenue, expected_loss, customers_expected_loss, avg_contribution, by_level, contribution, actions, top_customers, scored_at, model_version]
      properties:
        code: { type: string }
        scope: { type: string, enum: [main, any] }
        title: { type: string, description: 'Название признака' }
        plain: { type: [string, 'null'], description: 'Что это за причина простыми словами' }
        description: { type: [string, 'null'], description: 'Как признак считает модель (из реестра признаков)' }
        group: { type: [string, 'null'] }
        customers: { type: integer }
        primary_customers: { type: integer, description: 'У скольких из них причина главная' }
        monthly_revenue: { type: integer, description: 'Выручка этих клиентов в месяц, евроценты' }
        expected_loss: { type: integer, description: 'Часть ожидаемой потери, приходящаяся на причину, евроценты' }
        customers_expected_loss: { type: integer, description: 'Вся ожидаемая потеря этих клиентов, евроценты' }
        avg_contribution: { type: [number, 'null'], description: 'Средний вклад причины в score, пунктов' }
        by_level: { $ref: '#/components/schemas/LevelCounts' }
        contribution:
          type: array
          description: 'Сколько клиентов с каким вкладом причины в score: [0, 5), [5, 10) … [50, 100]'
          items:
            type: object
            required: [from, to, customers]
            properties:
              from: { type: number }
              to: { type: number }
              customers: { type: integer }
        actions:
          type: array
          description: 'Что делать: самые частые действия по этой причине у её клиентов'
          items:
            type: object
            required: [title, customers]
            properties:
              title: { type: string }
              customers: { type: integer }
        top_customers:
          type: array
          maxItems: 5
          items:
            type: object
            required: [id, email, risk_level, risk_score, contribution, expected_loss]
            properties:
              id: { type: integer, format: int64 }
              email: { type: string }
              risk_level: { $ref: '#/components/schemas/RiskLevel' }
              risk_score: { type: [number, 'null'] }
              contribution: { type: [number, 'null'], description: 'Вклад причины в score клиента, пунктов' }
              expected_loss: { type: integer, description: 'Потеря клиента, приходящаяся на причину, евроценты' }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    CustomerCharts:
      type: object
      required: [customer_id, as_of, runway, payments, score_history]
      properties:
        customer_id: { type: integer, format: int64 }
        as_of: { type: string, format: date-time, description: 'Опорный момент: время снимка или сейчас' }
        runway:
          type: object
          required: [start_balance, days, runs_out_at, model_runs_out_at, renewals, points]
          properties:
            start_balance: { type: integer, description: 'Баланс и разблокированные бонусы, евроценты' }
            days: { type: integer }
            runs_out_at:
              type: [string, 'null']
              format: date-time
              description: 'Первое автопродление, на которое денег уже нет, по текущим данным'
            model_runs_out_at:
              type: [string, 'null']
              format: date-time
              description: 'funds_run_out_at из оценки клиента'
            renewals: { type: integer, description: 'Сколько автопродлений в окне' }
            points:
              type: array
              items:
                type: object
                required: [date, balance, renewals, paid, unpaid]
                properties:
                  date: { type: string, format: date }
                  balance: { type: integer, description: 'Баланс на конец дня, евроценты' }
                  renewals: { type: integer }
                  paid: { type: integer, description: 'Списано за продления в этот день, евроценты' }
                  unpaid: { type: integer, description: 'Продления, на которые денег уже нет, евроценты' }
        payments:
          type: array
          description: '12 месяцев до опорного момента, от старых к новым'
          items:
            type: object
            required: [month, paid, payments, failed]
            properties:
              month: { type: string, examples: ['2026-10'] }
              paid: { type: integer, description: 'Проведено, евроценты' }
              payments: { type: integer }
              failed: { type: integer, description: 'Непрошедших платежей' }
        score_history:
          type: array
          description: 'Score в моменты отправки писем и текущий; пусто, если писем не было'
          items:
            type: object
            required: [at, risk_score, source]
            properties:
              at: { type: string, format: date-time }
              risk_score: { type: number }
              source: { type: string, enum: [email, now] }

    SummaryHistory:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items:
            type: object
            required: [at, model_version, full, customers_total, by_level, services_at_risk, expected_loss, exposure, monthly_revenue_total, revenue_at_risk_share]
            properties:
              at: { type: string, format: date-time }
              model_version: { type: integer }
              full: { type: boolean, description: 'Точка полного пересчёта' }
              customers_total: { type: integer }
              by_level: { $ref: '#/components/schemas/LevelCounts' }
              services_at_risk: { type: integer }
              expected_loss: { type: integer, description: евроценты }
              exposure: { type: integer, description: евроценты }
              monthly_revenue_total: { type: integer, description: евроценты }
              revenue_at_risk_share: { type: number }

    Summary:
      type: object
      required: [customers_total, by_level, services_total, services_at_risk, expected_loss, exposure, monthly_revenue_total, horizon_days, money_explanation, top_reasons, timeline, scored_at, model_version]
      properties:
        customers_total: { type: integer }
        by_level:
          type: object
          required: [high, medium, low, unknown]
          properties:
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            unknown: { type: integer }
        services_total: { type: integer }
        services_at_risk: { type: integer }
        expected_loss: { type: integer, description: евроценты }
        exposure: { type: integer, description: евроценты }
        monthly_revenue_total: { type: integer, description: евроценты }
        revenue_at_risk_share: { type: number, minimum: 0, maximum: 1 }
        horizon_days: { type: integer }
        money_explanation: { type: string }
        top_reasons:
          type: array
          description: 'Причины риска по базе, по убыванию ожидаемых потерь. Причин без клиентов в списке нет'
          items:
            type: object
            required: [code, title, customers]
            properties:
              code: { type: string }
              title: { type: string }
              customers: { type: integer, description: 'У скольких оценённых клиентов причина есть в разложении score' }
              primary_customers: { type: integer, description: 'У скольких клиентов эта причина главная (первая в reasons)' }
              expected_loss: { type: integer, description: 'Ожидаемые потери, которые приходятся на причину у этих клиентов, евроценты' }
        risk_scores:
          type: object
          description: 'Распределение risk_score оценённых клиентов (без unknown); из него же /metrics отдаёт churn_risk_score_*'
          required: [scored, avg, max, buckets]
          properties:
            scored: { type: integer, description: 'Сколько клиентов оценено' }
            avg: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Средний score; null, если оценённых нет' }
            max: { type: [number, 'null'], minimum: 0, maximum: 100 }
            buckets:
              type: array
              description: 'Накопленные корзины 10, 20, …, 100: count — клиентов со score не выше le'
              items:
                type: object
                required: [le, count]
                properties:
                  le: { type: number }
                  count: { type: integer }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelinePoint' }
        deleted_services:
          type: object
          description: 'Удалённые услуги в снимке, в том числе удалённые раньше окна факта в timeline'
          required: [total, last_date, last_estimated]
          properties:
            total: { type: integer, description: 'Сколько услуг в статусе deleted' }
            last_date: { type: [string, 'null'], format: date, description: 'Дата последнего удаления; null, если удалённых нет' }
            last_estimated: { type: boolean, description: 'Дата последнего удаления — оценка по окончанию оплаты, а не замеченная смена статуса' }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    FeatureWeight:
      type: object
      required: [code, title, description, group, weight, min, max, enabled]
      properties:
        code: { type: string }
        title: { type: string }
        description: { type: string }
        group: { type: string, examples: [renewal, finance, behavior] }
        level: { type: string, enum: [service, account] }
        weight: { type: number }
        default_weight: { type: number }
        min: { type: number }
        max: { type: number }
        enabled: { type: boolean }

    ModelSettings:
      type: object
      required: [version, updated_at, horizon_days, thresholds, weights]
      properties:
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }
        horizon_days: { type: integer, minimum: 1, maximum: 365 }
        thresholds:
          type: object
          required: [medium, high]
          description: 'score ≥ high → high; ≥ medium → medium; иначе low'
          properties:
            medium: { type: number, minimum: 0, maximum: 100 }
            high: { type: number, minimum: 0, maximum: 100 }
        weights:
          type: array
          items: { $ref: '#/components/schemas/FeatureWeight' }

    ModelSettingsPatch:
      type: object
      minProperties: 1
      properties:
        horizon_days: { type: integer, minimum: 1, maximum: 365 }
        thresholds:
          type: object
          properties:
            medium: { type: number, minimum: 0, maximum: 100 }
            high: { type: number, minimum: 0, maximum: 100 }
        weights:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { type: string }
              weight: { type: number }
              enabled: { type: boolean }

    PreviewTotals:
      type: object
      required: [horizon_days, thresholds, expected_loss, exposure, services_at_risk, revenue_at_risk_share, by_level]
      properties:
        horizon_days: { type: integer }
        thresholds:
          type: object
          required: [medium, high]
          properties:
            medium: { type: number }
            high: { type: number }
        expected_loss: { type: integer, description: 'Ожидаемая потеря за горизонт, евроценты' }
        exposure: { type: integer, description: 'Выручка услуг среднего и высокого риска, евроценты' }
        services_at_risk: { type: integer }
        revenue_at_risk_share: { type: number, minimum: 0, maximum: 1 }
        by_level:
          type: object
          required: [high, medium, low, unknown]
          properties:
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            unknown: { type: integer }

    PreviewCustomerChange:
      type: object
      required: [id, email, level_before, level_after, score_before, score_after, expected_loss_before, expected_loss_after]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        level_before: { $ref: '#/components/schemas/RiskLevel' }
        level_after: { $ref: '#/components/schemas/RiskLevel' }
        score_before: { type: [number, 'null'] }
        score_after: { type: [number, 'null'] }
        expected_loss_before: { type: integer }
        expected_loss_after: { type: integer }

    ModelSettingsPreview:
      type: object
      required: [model_version, exact, customers_total, sample_size, before, after, changes_total, into_high, out_of_high, changes, duration_ms]
      properties:
        model_version: { type: integer, description: 'Версия настроек, от которой считается «было»' }
        exact:
          type: boolean
          description: |
            `false` — база больше PREVIEW_SAMPLE_SIZE клиентов: посчитана выборка, счётчики
            и деньги масштабированы на всю базу, список клиентов — только из выборки.
        customers_total: { type: integer }
        sample_size: { type: integer, description: 'Сколько клиентов посчитано на самом деле' }
        before: { $ref: '#/components/schemas/PreviewTotals' }
        after: { $ref: '#/components/schemas/PreviewTotals' }
        changes_total: { type: integer, description: 'Сколько посчитанных клиентов сменят уровень' }
        into_high: { type: integer }
        out_of_high: { type: integer }
        changes:
          type: array
          maxItems: 50
          description: 'Сначала попадающие в высокий риск, потом выходящие из него, внутри — по изменению потери'
          items: { $ref: '#/components/schemas/PreviewCustomerChange' }
        duration_ms: { type: number }

    SettingsChange:
      type: object
      required: [version, changed_at, changed_by, changes]
      properties:
        version: { type: integer }
        changed_at: { type: string, format: date-time }
        changed_by: { type: [string, 'null'] }
        changes:
          type: array
          items:
            type: object
            required: [path, old, new]
            properties:
              path: { type: string, examples: ['weights.autoprolong_off_expiring.weight'] }
              old: {}
              new: {}

    QualityRanking:
      type: object
      description: 'Качество ранжирования одного метода; доли от 0 до 1'
      required: [roc_auc, pr_auc, precision_top5, recall_top5, precision_top10, recall_top10]
      properties:
        roc_auc: { type: [number, 'null'] }
        pr_auc: { type: [number, 'null'] }
        precision_top5: { type: [number, 'null'], description: 'Доля ушедших среди 5 % клиентов с наибольшим score' }
        recall_top5: { type: [number, 'null'] }
        precision_top10: { type: [number, 'null'] }
        recall_top10: { type: [number, 'null'] }
        roc_auc_ci: { type: [array, 'null'], items: { type: [number, 'null'] }, minItems: 2, maxItems: 2, description: '95 % бутстреп-интервал, только у модели' }
        pr_auc_ci: { type: [array, 'null'], items: { type: [number, 'null'] }, minItems: 2, maxItems: 2 }

    QualityRankingSet:
      type: object
      description: 'model — score модели; autoprolong_off и prolong_wait — простые правила; random — случайный порядок; segment_oracle — скрытый сегмент генератора, модели недоступен'
      required: [model, autoprolong_off, prolong_wait, random, segment_oracle]
      properties:
        model: { $ref: '#/components/schemas/QualityRanking' }
        autoprolong_off: { $ref: '#/components/schemas/QualityRanking' }
        prolong_wait: { $ref: '#/components/schemas/QualityRanking' }
        random: { $ref: '#/components/schemas/QualityRanking' }
        segment_oracle: { $ref: '#/components/schemas/QualityRanking' }

    QualityTargets:
      type: object
      description: 'churned — ушёл полностью (потеряны все услуги, действовавшие на T); lost_any — потерял хотя бы одну'
      required: [churned, lost_any]
      properties:
        churned: { $ref: '#/components/schemas/QualityRankingSet' }
        lost_any: { $ref: '#/components/schemas/QualityRankingSet' }

    QualityLevel:
      type: object
      required: [level, n]
      properties:
        level: { type: string, enum: [low, medium, high, all] }
        n: { type: integer }
        share_of_base: { type: [number, 'null'] }
        churn_rate: { type: [number, 'null'] }
        churn_lift: { type: [number, 'null'], description: 'Во сколько раз чаще уходят полностью, чем в среднем по базе' }
        lost_any_rate: { type: [number, 'null'] }
        lost_any_lift: { type: [number, 'null'] }
        revenue: { type: [number, 'null'], description: 'Выручка за горизонт, евроценты' }
        expected_loss: { type: [number, 'null'], description: 'Прогноз потерь модели, евроценты' }
        actual_loss: { type: [number, 'null'], description: 'Фактически потеряно в симуляции, евроценты' }
        predicted_share: { type: [number, 'null'] }
        actual_share: { type: [number, 'null'] }

    QualityRates:
      type: object
      required: [churned, lost_any]
      properties:
        churned: { type: [number, 'null'] }
        lost_any: { type: [number, 'null'] }
        revenue_lost_share: { type: [number, 'null'] }

    QualityPrecisionRecall:
      type: object
      required: [precision, recall]
      properties:
        precision: { type: [number, 'null'] }
        recall: { type: [number, 'null'] }

    QualityThreshold:
      type: object
      required: [flagged, flagged_share, churned, lost_any]
      properties:
        flagged: { type: integer, description: 'Сколько клиентов попадает под порог' }
        flagged_share: { type: [number, 'null'] }
        churned: { $ref: '#/components/schemas/QualityPrecisionRecall' }
        lost_any: { $ref: '#/components/schemas/QualityPrecisionRecall' }

    QualityScenario:
      type: object
      required: [accounts, services, base_rates, ranking, levels, calibration, roc, thresholds, hard_subset]
      properties:
        accounts: { type: integer }
        services: { type: integer }
        base_rates: { $ref: '#/components/schemas/QualityRates' }
        ranking: { $ref: '#/components/schemas/QualityTargets' }
        levels:
          type: array
          items: { $ref: '#/components/schemas/QualityLevel' }
        calibration:
          type: array
          description: 'Децили score: прогноз и факт доли потерянной выручки'
          items:
            type: object
            required: [group, n, score_min, score_max, predicted_share, actual_share]
            properties:
              group: { type: integer }
              n: { type: integer }
              score_min: { type: number }
              score_max: { type: number }
              predicted_share: { type: [number, 'null'] }
              actual_share: { type: [number, 'null'] }
        roc:
          type: object
          description: 'ROC-кривые на общей сетке FPR, цель churned'
          required: [target, fpr, tpr]
          properties:
            target: { type: string, enum: [churned, lost_any] }
            fpr: { type: array, items: { type: number } }
            tpr:
              type: object
              required: [model, autoprolong_off, prolong_wait, segment_oracle]
              properties:
                model: { type: array, items: { type: number } }
                autoprolong_off: { type: array, items: { type: number } }
                prolong_wait: { type: array, items: { type: number } }
                segment_oracle: { type: array, items: { type: number } }
        thresholds:
          type: object
          description: 'Если работать со всеми клиентами уровня high (или medium и выше)'
          required: [high, medium_plus]
          properties:
            high: { $ref: '#/components/schemas/QualityThreshold' }
            medium_plus: { $ref: '#/components/schemas/QualityThreshold' }
        hard_subset:
          type: object
          description: 'Клиенты, у которых на T ничего не ждёт оплаты'
          required: [description, accounts, base_rates, ranking, levels]
          properties:
            description: { type: string }
            accounts: { type: integer }
            base_rates: { $ref: '#/components/schemas/QualityRates' }
            ranking: { $ref: '#/components/schemas/QualityTargets' }
            levels:
              type: array
              items: { $ref: '#/components/schemas/QualityLevel' }

    QualityRobustnessScenario:
      type: object
      required: [roc_auc, pr_auc, churn_lift_high, base_churned]
      properties:
        roc_auc: { type: [number, 'null'] }
        pr_auc: { type: [number, 'null'] }
        churn_lift_high: { type: [number, 'null'] }
        base_churned: { type: [number, 'null'] }

    ModelQuality:
      type: object
      required: [params, scenarios, robustness, current_model]
      properties:
        params:
          type: object
          required: [accounts, seed, reference, horizon_days, stream_rate, background_rate, concentration, bootstrap, riskcore_version, riskcore_sources, simulator_sources, weights, thresholds]
          properties:
            accounts: { type: integer }
            seed: { type: integer }
            reference: { type: string, description: 'Момент T, ISO 8601' }
            horizon_days: { type: integer }
            stream_rate: { type: number, description: 'Изменений живого потока на услугу в сутки (stream)' }
            background_rate: { type: number }
            concentration: { type: number, description: 'Разброс поведения внутри сегмента (calendar)' }
            bootstrap: { type: integer }
            riskcore_version: { type: string }
            riskcore_sources: { type: string, description: 'Отпечаток исходников riskcore, на которых шла проверка' }
            simulator_sources: { type: string }
            weights: { type: object, additionalProperties: { type: number }, description: 'Веса признаков при проверке' }
            thresholds:
              type: object
              required: [medium, high]
              properties:
                medium: { type: number }
                high: { type: number }
        scenarios:
          type: object
          description: 'stream — живой поток симулятора; calendar — продления строго по сроку, решение по скрытому поведению сегмента'
          required: [stream, calendar]
          properties:
            stream: { $ref: '#/components/schemas/QualityScenario' }
            calendar: { $ref: '#/components/schemas/QualityScenario' }
        robustness:
          type: array
          description: 'Основной прогон и соседние: другие seed, темп потока, разброс поведения'
          items:
            type: object
            required: [label, seed, stream_rate, concentration, scenarios]
            properties:
              label: { type: string }
              seed: { type: integer }
              stream_rate: { type: number }
              concentration: { type: number }
              scenarios:
                type: object
                properties:
                  stream: { $ref: '#/components/schemas/QualityRobustnessScenario' }
                  calendar: { $ref: '#/components/schemas/QualityRobustnessScenario' }
        current_model:
          type: object
          required: [riskcore_sources, matches]
          properties:
            riskcore_sources: { type: [string, 'null'], description: 'Отпечаток установленного riskcore' }
            matches: { type: [boolean, 'null'], description: 'Совпадает ли с тем, на котором считались цифры' }

    SourceAccount:
      type: object
      required: [id, email, balance, withdrawBalance, totalReplenished, bonusBalance, bonusState]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        balance: { type: integer, minimum: 0 }
        withdrawBalance: { type: integer, minimum: 0 }
        totalReplenished: { type: integer, minimum: 0 }
        bonusBalance: { type: integer, minimum: 0 }
        bonusState: { type: string, enum: [locked, unlocked] }

    SourceService:
      type: object
      required: [id, name, ownerId, paymentTerm, autoProlong, createdAt, expiresAt, status, price]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        ownerId: { type: integer, format: int64 }
        paymentTerm: { $ref: '#/components/schemas/PaymentTerm' }
        autoProlong: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        price: { type: integer, minimum: 0 }

    SourceTransaction:
      type: object
      required: [id, amount, status, createdAt, type, serviceId]
      properties:
        id: { type: integer, format: int64 }
        amount: { type: integer, minimum: 0 }
        status: { type: string, enum: [performed, not_performed] }
        performedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        type: { type: string, enum: [prolong, order] }
        serviceId: { type: integer, format: int64 }

    SourceSnapshot:
      type: object
      required: [accounts, services, transactions]
      properties:
        reference_time:
          type: [string, 'null']
          format: date-time
          description: 'Момент, на который снят снимок. Если не задан — текущее время.'
        accounts:
          type: array
          items: { $ref: '#/components/schemas/SourceAccount' }
        services:
          type: array
          items: { $ref: '#/components/schemas/SourceService' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/SourceTransaction' }

    SourceChangeBatch:
      type: object
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/SourceAccount' }
        services:
          type: array
          items: { $ref: '#/components/schemas/SourceService' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/SourceTransaction' }

    SnapshotAccepted:
      type: object
      required: [snapshot_id, counts]
      properties:
        snapshot_id: { type: string }
        counts:
          type: object
          required: [accounts, services, transactions]
          properties:
            accounts: { type: integer }
            services: { type: integer }
            transactions: { type: integer }

    SimulatorState:
      type: object
      required: [running, interval_ms, events_emitted]
      properties:
        running: { type: boolean }
        interval_ms: { type: integer }
        events_emitted: { type: integer }

    SimulatorCommand:
      type: object
      properties:
        running: { type: boolean }
        interval_ms: { type: integer, minimum: 200, maximum: 60000 }
        generate:
          type: object
          description: Сгенерировать и загрузить расширенный набор вместо текущего
          properties:
            accounts: { type: integer, minimum: 1, maximum: 200000 }
            seed: { type: integer }

    ScoresUpdatedEvent:
      type: object
      required: [model_version, scored_at, changed_customer_ids, summary]
      properties:
        model_version: { type: integer }
        scored_at: { type: string, format: date-time }
        changed_customer_ids:
          type: array
          description: 'Пустой массив с full=true — пересчитаны все'
          items: { type: integer }
        full: { type: boolean }
        duration_ms: { type: number }
        summary:
          type: object
          required: [customers_total, by_level, expected_loss, exposure]
          properties:
            customers_total: { type: integer }
            by_level:
              type: object
              properties:
                high: { type: integer }
                medium: { type: integer }
                low: { type: integer }
                unknown: { type: integer }
            expected_loss: { type: integer }
            exposure: { type: integer }

    SettingsUpdatedEvent:
      type: object
      required: [version, updated_by]
      properties:
        version: { type: integer }
        updated_by: { type: [string, 'null'] }

    SourceUpdatedEvent:
      type: object
      required: [kind, counts]
      properties:
        kind: { type: string, enum: [snapshot, changes] }
        snapshot_id: { type: [string, 'null'] }
        counts:
          type: object
          properties:
            accounts: { type: integer }
            services: { type: integer }
            transactions: { type: integer }

    AlertItem:
      type: object
      required: [id, kind, message, link]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [loss_growth, big_customer_high, risk_share, high_count_growth, stale_data, high_risk, loss_jump, total_loss_jump, bulk] }
        customer_id: { type: [integer, 'null'], description: 'null у total_loss_jump и bulk' }
        email: { type: [string, 'null'] }
        risk_level: { type: [string, 'null'] }
        prev_level: { type: [string, 'null'] }
        expected_loss: { type: [integer, 'null'], description: евроценты }
        prev_loss: { type: [integer, 'null'], description: 'евроценты, точка отсчёта роста' }
        message: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        link: { type: string, description: 'путь в панели: /customers/{id}, для сводных — отфильтрованный список /customers?level=high...' }

    AlertPage:
      type: object
      required: [items, total, page, page_size, latest_id, channels]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AlertItem' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        latest_id: { type: [integer, 'null'] }
        channels:
          type: object
          required: [feed, webhook, telegram]
          properties:
            feed: { type: boolean }
            webhook: { type: boolean }
            telegram: { type: boolean }

    AlertEventCode:
      type: string
      enum: [loss_growth, big_customer_high, risk_share, high_count_growth, stale_data]

    AlertChannel:
      type: string
      enum: [panel, email, telegram]

    AlertEventPreference:
      type: object
      required: [enabled, threshold, channels]
      properties:
        enabled: { type: boolean }
        threshold: { type: number, description: 'В единицах события: %, € (не центы), штуки или минуты' }
        period_h: { type: [integer, 'null'], enum: [1, 6, 24, 72, 168, null], description: 'Окно «рост за период»' }
        channels: { type: array, items: { $ref: '#/components/schemas/AlertChannel' } }

    AlertPreferencesInput:
      type: object
      properties:
        email: { type: [string, 'null'] }
        timezone: { type: string, examples: [Europe/Moscow] }
        quiet_from: { type: [string, 'null'], description: 'ЧЧ:ММ; почта и Telegram ждут конца тихих часов' }
        quiet_to: { type: [string, 'null'] }
        digest_enabled: { type: boolean }
        digest_time: { type: string, description: ЧЧ:ММ по часовому поясу пользователя }
        digest_channels: { type: array, items: { type: string, enum: [email, telegram] } }
        events:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AlertEventPreference' }

    AlertPreferences:
      allOf:
        - $ref: '#/components/schemas/AlertPreferencesInput'
        - type: object
          required: [username, timezone, digest_enabled, digest_time, digest_channels, events]
          properties:
            username: { type: string }
            mute_until: { type: [string, 'null'], format: date-time, description: 'Пауза из Telegram (/mute)' }

    AlertEventDefinition:
      type: object
      required: [code, title, description, unit, default_threshold, min_threshold, max_threshold, default_enabled]
      properties:
        code: { $ref: '#/components/schemas/AlertEventCode' }
        title: { type: string }
        description: { type: string }
        unit: { type: string, enum: [pct, eur, count, min] }
        default_threshold: { type: number }
        min_threshold: { type: number }
        max_threshold: { type: number }
        default_period_h: { type: [integer, 'null'] }
        default_enabled: { type: boolean }

    AlertChannelState:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: [string, 'null'] }
        bot_username: { type: [string, 'null'] }
        linked: { type: boolean }
        tg_username: { type: [string, 'null'] }

    AlertPreferencesResponse:
      type: object
      required: [preferences, catalog, periods_h, channels]
      properties:
        preferences: { $ref: '#/components/schemas/AlertPreferences' }
        catalog: { type: array, items: { $ref: '#/components/schemas/AlertEventDefinition' } }
        periods_h: { type: array, items: { type: integer } }
        channels:
          type: object
          required: [panel, email, telegram]
          properties:
            panel: { $ref: '#/components/schemas/AlertChannelState' }
            email: { $ref: '#/components/schemas/AlertChannelState' }
            telegram: { $ref: '#/components/schemas/AlertChannelState' }

    AlertSubscriber:
      type: object
      required: [username, enabled_events, channels, digest_enabled, telegram_linked]
      properties:
        username: { type: string }
        email: { type: [string, 'null'] }
        enabled_events: { type: array, items: { $ref: '#/components/schemas/AlertEventCode' } }
        channels: { type: array, items: { $ref: '#/components/schemas/AlertChannel' } }
        digest_enabled: { type: boolean }
        telegram_linked: { type: boolean }
        tg_username: { type: [string, 'null'] }
        updated_at: { type: [string, 'null'], format: date-time }
        updated_by: { type: [string, 'null'] }

    NotificationItem:
      type: object
      required: [id, event_type, title, message, link, read]
      properties:
        id: { type: integer }
        event_type: { type: string, description: 'Код события, digest или test' }
        title: { type: string }
        message: { type: string }
        link: { type: string, description: Путь в панели }
        created_at: { type: [string, 'null'], format: date-time }
        read: { type: boolean }

    NotificationInbox:
      type: object
      required: [items, unread]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/NotificationItem' } }
        unread: { type: integer }
