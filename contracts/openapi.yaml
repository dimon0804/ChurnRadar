openapi: 3.1.0
info:
  title: ChurnRadar API
  version: 1.0.0
  description: |
    Анализатор рисков оттока клиентов хостинга.

    Все денежные поля передаются в **евроцентах** (целое число, €1 = 100).
    Время — ISO 8601 в UTC.

    Доступ: все методы, кроме `POST /api/v1/auth/login`, `GET /api/v1/auth/providers`
    и OIDC-редиректов, требуют сессию (cookie `cr_session`) или `Authorization: Bearer`.
    `GET /metrics` закрыт отдельным токеном сборщика метрик.
servers:
  - url: http://localhost:8080
    description: Локальный запуск через Docker Compose
tags:
  - name: auth
    description: Вход, сессия, OIDC
  - name: customers
    description: Клиенты и их оценки риска
  - name: actions
    description: С кем связаться сегодня и отметки работы с клиентом
  - name: mail
    description: Письма клиентам, шаблоны, рассылки и их эффективность
  - name: analytics
    description: Сводные показатели и денежная оценка
  - name: model
    description: Настройки модели risk-score
  - name: source
    description: Загрузка исходных данных
  - name: stream
    description: Живые обновления (Server-Sent Events)
  - name: simulator
    description: Поток демонстрационных изменений данных
  - name: alerts
    description: Оповещения о росте риска (сервис alerts)
  - name: ops
    description: Метрики и служебные эндпоинты

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Вход по логину и паролю
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Успешный вход. Сессия выставлена в httpOnly cookie `cr_session`.
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Текущий пользователь
      operationId: me
      responses:
        '200':
          description: Пользователь текущей сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Завершение текущей сессии
      operationId: logout
      responses:
        '204': { description: Сессия завершена }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/providers:
    get:
      tags: [auth]
      summary: Доступные способы входа
      operationId: authProviders
      security: []
      responses:
        '200':
          description: Список способов входа
          content:
            application/json:
              schema:
                type: object
                required: [password, oidc]
                properties:
                  password: { type: boolean }
                  oidc:
                    type: object
                    required: [enabled]
                    properties:
                      enabled: { type: boolean }
                      display_name: { type: string, examples: ['Войти через SSO'] }
                      login_url: { type: string, examples: ['/api/v1/auth/oidc/login'] }

  /api/v1/auth/oidc/login:
    get:
      tags: [auth]
      summary: Начало входа через OIDC (Authorization Code + PKCE)
      operationId: oidcLogin
      security: []
      parameters:
        - name: next
          in: query
          schema: { type: string, default: / }
      responses:
        '302': { description: Редирект на провайдера OIDC }
        '404': { description: OIDC не настроен }

  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Возврат от провайдера OIDC
      operationId: oidcCallback
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: 'Сессия создана, редирект в панель' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/customers:
    get:
      tags: [customers]
      summary: Список клиентов с оценками риска (рейтинг)
      operationId: listCustomers
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, email, balance, total_replenished, risk_score, expected_loss]
            default: risk_score
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: level
          in: query
          description: Фильтр по уровням через запятую, например `high,medium`
          schema: { type: string, examples: ['high,medium'] }
        - name: search
          in: query
          description: Поиск по email (подстрока) или точному ID
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 25 }
      responses:
        '200':
          description: Страница рейтинга
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}:
    get:
      tags: [customers]
      summary: Подробная оценка клиента, его услуги, признаки и объяснения
      operationId: getCustomer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Карточка клиента
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/customers/export.csv:
    get:
      tags: [customers]
      summary: Выгрузка клиентов в CSV для рассылки и Excel
      description: |
        Те же фильтры и сортировка, что у списка, но без страниц: все подходящие клиенты
        (до 100 000 строк). Файл в UTF-8 с BOM, разделитель «;», дробная часть через
        запятую — так его без мастера импорта открывает русский Excel. Суммы в евро.

        Колонки: ID, Email, Уровень риска, Риск (баллы), Ожидаемая потеря (€), Баланс (€),
        Пополнения всего (€), Главная причина, Что сделать, Статус.
      operationId: exportCustomers
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [id, email, balance, total_replenished, risk_score, expected_loss]
            default: risk_score
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: level
          in: query
          description: Фильтр по уровням через запятую, например `high,medium`
          schema: { type: string }
        - name: search
          in: query
          description: Поиск по email (подстрока) или точному ID
          schema: { type: string }
        - name: worklist
          in: query
          description: 'Только очередь «С кем связаться сегодня»: есть оценка, есть потеря, нет действующей отметки'
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: CSV-файл
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="churnradar-clients-2026-10-24.csv"'] }
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}/action:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [actions]
      summary: Отметка работы с клиентом и журнал отметок
      operationId: getCustomerAction
      responses:
        '200':
          description: Текущая отметка и последние 20 записей журнала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [actions]
      summary: Отметить клиента «Письмо отправлено», «Решено» или «Отложено»
      description: |
        Доступно любому вошедшему пользователю, в том числе аналитику: отметка не меняет
        ни данные, ни модель, только очередь. Кто и когда отметил, пишется в журнал.

        «Письмо отправлено» ставится само при отправке письма из панели; вручную — если
        написали из своей почты. Клиент вернётся в очередь, если за срок ожидания не ответил
        или его риск вырос. «Решено» прячет клиента, пока ожидаемая потеря или уровень риска
        не вырастут по сравнению с моментом отметки. «Отложено» прячет до даты.
      operationId: putCustomerAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerActionUpdate' }
      responses:
        '200':
          description: Отметка сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [actions]
      summary: Снять отметку — клиент возвращается в очередь
      operationId: deleteCustomerAction
      responses:
        '200':
          description: Отметка снята (если её не было — ничего не меняется)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActionState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/contact-today:
    get:
      tags: [actions]
      summary: С кем связаться сегодня
      description: |
        Клиенты с оценкой риска (не unknown) и ненулевой ожидаемой потерей, по убыванию
        ожидаемой потери: первым идёт тот, на ком можно спасти больше всего денег.
        Клиенты с действующей отметкой («Письмо отправлено» в срок ожидания ответа, «Решено»,
        «Отложено») в очередь не попадают; `marked=true` показывает как раз их.
      operationId: contactToday
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 5 } }
        - { name: marked, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactToday' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}/email/draft:
    post:
      tags: [mail]
      summary: Черновик письма клиенту по шаблону
      description: Шаблон по главной причине риска (или указанный), подстановки уже заполнены.
      operationId: draftCustomerEmail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailDraftRequest' }
      responses:
        '200':
          description: Черновик
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/customers/{id}/email:
    post:
      tags: [mail]
      summary: Отправить письмо клиенту
      description: |
        Письмо уходит по SMTP сразу, в этом же запросе. После отправки клиент получает
        отметку «Письмо отправлено», в журнал пишется тема, кто и когда. Reply-To — почта
        сотрудника (заголовок X-User-Email от шлюза), иначе SMTP_REPLY_TO или SMTP_FROM.
      operationId: sendCustomerEmail
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailSendRequest' }
      responses:
        '200':
          description: Письмо отправлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmailSent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '502':
          description: Почтовый сервер не принял письмо (письмо сохранено со статусом failed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Отправка не настроена (нет SMTP_HOST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mail/templates:
    get:
      tags: [mail]
      summary: Шаблоны писем и доступные подстановки
      operationId: listMailTemplates
      responses:
        '200':
          description: Шаблоны
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailTemplates' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/mail/templates/{code}:
    put:
      tags: [mail]
      summary: Изменить шаблон (только admin)
      operationId: putMailTemplate
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MailTemplatePatch' }
      responses:
        '200':
          description: Шаблон сохранён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/mail/templates/{code}/reset:
    post:
      tags: [mail]
      summary: Вернуть исходный текст шаблона (только admin)
      operationId: resetMailTemplate
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Шаблон с исходным текстом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailTemplate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mail/campaigns/preview:
    post:
      tags: [mail]
      summary: Сколько писем уйдёт в рассылке и пример письма
      operationId: previewMailCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '200':
          description: Предпросмотр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/mail/campaigns:
    get:
      tags: [mail]
      summary: Последние рассылки
      operationId: listMailCampaigns
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Рассылки от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [mail]
      summary: Запустить рассылку
      description: |
        Письма кладутся в очередь и уходят в фоне, не быстрее MAIL_RATE_PER_S в секунду.
        Тем, кому писали за последние skip_days дней, письмо не отправляется. Прогресс —
        GET /api/v1/mail/campaigns/{id}.
      operationId: createMailCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignRequest' }
      responses:
        '202':
          description: Рассылка поставлена в очередь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Отправка не настроена (нет SMTP_HOST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/mail/campaigns/{id}:
    get:
      tags: [mail]
      summary: Прогресс и итог рассылки
      operationId: getMailCampaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Рассылка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/mail/stats:
    get:
      tags: [mail]
      summary: Сколько писем отправлено и скольким клиентам это помогло
      operationId: mailStats
      responses:
        '200':
          description: Статистика за MAIL_STATS_DAYS дней (по умолчанию 30)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MailStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/analytics/summary:
    get:
      tags: [analytics]
      summary: Сводные показатели риска и денежная оценка потенциальных потерь
      operationId: getSummary
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Summary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/model/settings:
    get:
      tags: [model]
      summary: Действующие настройки и коэффициенты модели
      operationId: getModelSettings
      responses:
        '200':
          description: Настройки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [model]
      summary: Изменение настроек модели с автоматическим пересчётом
      description: |
        Частичное обновление. Пересчёт запускается асинхронно; о завершении сообщает
        событие `scores.updated` в `/api/v1/stream`. Требуется роль `admin`.
      operationId: patchModelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsPatch' }
      responses:
        '200':
          description: Новое состояние настроек (version увеличена)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/model/settings/preview:
    post:
      tags: [model]
      summary: «Что если» — что изменится после PATCH, без сохранения
      description: |
        Принимает то же тело, что PATCH, и с теми же проверками. Ничего не сохраняет:
        версия настроек и оценки клиентов не меняются. «Было» и «станет» считаются на одном
        снимке данных, «станет» совпадает с тем, что получится после PATCH и пересчёта.
        На базе больше PREVIEW_SAMPLE_SIZE клиентов (по умолчанию 2000) считается выборка,
        тогда `exact: false`. Требуется роль `admin`.
      operationId: previewModelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModelSettingsPatch' }
      responses:
        '200':
          description: Сравнение «было → станет»
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettingsPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Пришёл более новый запрос предпросмотра, этот не считался
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503':
          description: Сервис оценки недоступен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '504':
          description: Расчёт не уложился в PREVIEW_TIMEOUT_S
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/model/settings/reset:
    post:
      tags: [model]
      summary: Сброс настроек к значениям по умолчанию
      operationId: resetModelSettings
      responses:
        '200':
          description: Настройки по умолчанию (version увеличена)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/model/settings/history:
    get:
      tags: [model]
      summary: Журнал изменений настроек модели
      operationId: modelSettingsHistory
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Изменения от новых к старым
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/SettingsChange' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/model/quality:
    get:
      tags: [model]
      summary: Качество модели на синтетическом будущем
      description: |
        Результаты проверки `python -m tools.calibration`: база из 20 000 синтетических клиентов,
        оценка моделью на момент T и 30 дней будущего в двух сценариях симуляции. Lift по уровням
        риска, ROC и сравнение с простыми правилами, точность и полнота порогов, калибровка,
        прогоны с другими seed. Файл кладётся в образ api при сборке и на лету не меняется.
        `current_model.matches` говорит, совпадает ли код установленной модели с тем, на котором
        считались цифры. Доступно любому вошедшему пользователю.
      operationId: modelQuality
      responses:
        '200':
          description: Результаты проверки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelQuality' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Файла с результатами нет в сборке или он не прошёл проверку схемы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/v1/source/snapshot:
    put:
      tags: [source]
      summary: Загрузка или полная замена снимка исходных данных
      description: |
        Формат тела совпадает с `data.json` из комплекта кейса. Замена атомарная.
        Пересчёт асинхронный, о завершении сообщает `scores.updated`. Требуется роль `admin`.
      operationId: putSnapshot
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
        - name: reset_history
          in: query
          required: false
          description: |
            Снимок описывает другой набор клиентов: прежняя история статусов удаляется,
            иначе смены статусов между снимками попадают в факт на графике.
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceSnapshot' }
      responses:
        '202':
          description: Снимок принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/source/events:
    post:
      tags: [source]
      summary: Поток изменений отдельных записей (данные в реальном времени)
      description: |
        Пакет upsert-изменений аккаунтов, услуг и транзакций. Так источник шлёт изменения
        в реальном времени, без полной замены снимка. Требуется роль `admin` или сервисный токен.
      operationId: postSourceEvents
      parameters:
        - $ref: '#/components/parameters/ContentEncoding'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceChangeBatch' }
      responses:
        '202':
          description: Изменения приняты
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/stream:
    get:
      tags: [stream]
      summary: Живые обновления (Server-Sent Events)
      description: |
        `text/event-stream`. События: `scores.updated`, `settings.updated`, `source.updated`
        (схемы `ScoresUpdatedEvent`, `SettingsUpdatedEvent`, `SourceUpdatedEvent`).
        Каждые 15 с приходит комментарий `: ping`. Поддерживается `Last-Event-ID`.
        Служебное событие `resync` (без `id`, `data: {"reason": "..."}`) означает, что часть
        событий могла потеряться: после восстановления связи notifier с NATS
        (`nats_connected`, `nats_reconnected`) или если реплика не может воспроизвести поток
        с переданного `Last-Event-ID` (`unknown_last_event_id`). Получив его, клиент
        перечитывает все данные.
      operationId: stream
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Поток событий
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/alerts:
    get:
      tags: [alerts]
      summary: Лента оповещений
      description: |
        Отдаёт сервис alerts. Новые записи сверху. Оповещение появляется, когда клиент перешёл
        в высокий риск, его ожидаемая потеря выросла больше порога или выросла общая ожидаемая
        потеря. Массовое изменение (снимок, больше `ALERTS_BULK_THRESHOLD` клиентов за пересчёт)
        приходит одной сводной записью `bulk`. `latest_id` — id самой свежей записи, по нему
        панель считает новые.
      operationId: listAlerts
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: customer_id, in: query, schema: { type: integer, minimum: 1 } }
        - name: kind
          in: query
          schema: { type: string, enum: [high_risk, loss_jump, total_loss_jump, bulk] }
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/simulator:
    get:
      tags: [simulator]
      summary: Состояние демонстрационного потока изменений
      operationId: getSimulator
      responses:
        '200':
          description: Состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [simulator]
      summary: Включить/выключить поток или сгенерировать расширенный набор
      operationId: putSimulator
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulatorCommand' }
      responses:
        '200':
          description: Новое состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /metrics:
    get:
      tags: [ops]
      summary: Агрегированные метрики в формате Prometheus
      description: |
        Обязательные метрики:
        `churn_customers_by_risk_level{level="high|medium|low|unknown"}`,
        `churn_expected_loss_eur`, `churn_exposure_eur`, `churn_services_at_risk`,
        `churn_model_version`, `churn_last_scored_timestamp_seconds`.

        Риск-скор клиентов (те же числа, что `risk_scores` в `/api/v1/analytics/summary`):
        `churn_risk_score_avg`, `churn_risk_score_max`, `churn_risk_score_customers`,
        `churn_risk_score_bucket{le="10|20|…|100|+Inf"}` — снимок распределения на момент
        последнего пересчёта (gauge, накопленные корзины), а также доля выручки под риском
        `churn_revenue_at_risk_ratio`.
      operationId: metrics
      security:
        - metricsToken: []
      responses:
        '200':
          description: Текстовый формат экспозиции Prometheus
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/docs:
    get:
      tags: [ops]
      summary: Swagger UI с этой спецификацией
      operationId: docs
      responses:
        '200':
          description: HTML
          content:
            text/html:
              schema: { type: string }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cr_session
    bearerAuth:
      type: http
      scheme: bearer
    metricsToken:
      type: http
      scheme: bearer
      description: Статический токен сборщика метрик (`METRICS_TOKEN`)

  parameters:
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: |
        Тело можно сжать gzip. Лимиты задаются переменными ingest: `MAX_COMPRESSED_BODY_BYTES`
        (сжатое тело) и `MAX_BODY_BYTES` (после распаковки).
      schema: { type: string, enum: [gzip, identity] }

  responses:
    BadRequest:
      description: Тело не читается (например, повреждённый gzip)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: Тело больше лимита (до или после распаковки)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Неподдерживаемый Content-Encoding
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет сессии или неверные учётные данные
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточно прав (нужна роль admin)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Слишком много попыток
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, examples: [invalid_credentials, not_found, validation_error] }
            message: { type: string, description: Сообщение по-русски для пользователя }
            details: { description: 'Детали, например поля с ошибками' }
            request_id: { type: string }

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 256 }

    User:
      type: object
      required: [id, username, display_name, roles, auth_method]
      properties:
        id: { type: string }
        username: { type: string }
        display_name: { type: string }
        roles:
          type: array
          items: { type: string, enum: [admin, analyst] }
        auth_method: { type: string, enum: [password, oidc] }

    RiskLevel:
      type: string
      enum: [high, medium, low, unknown]
      description: '`unknown` — данных недостаточно, оценки нет'

    PaymentTerm:
      type: string
      enum: [hour, week, month, quarter_year, half_year, year]

    ServiceStatus:
      type: string
      enum: [active, suspended, prolong_wait, deleted, blocked]

    Reason:
      type: object
      required: [code, title, contribution]
      properties:
        code: { type: string, description: Код признака из реестра модели, examples: [autoprolong_off_expiring] }
        title: { type: string, description: Объяснение по-русски для маркетолога }
        label:
          type: string
          description: 'Короткое название причины (название признака, для «нет оценки» — короткая подпись): для таблиц и списков, где длинный title не помещается'
          examples: [Не хватит денег на продление]
        contribution: { type: number, description: 'Вклад в score, пунктов из 100' }
        service_id: { type: [integer, 'null'], format: int64, description: 'К какой услуге относится, если относится' }
        action: { type: string, description: 'Что сделать маркетологу по этой причине, коротко и с цифрами из данных' }
        expected_loss: { type: integer, description: 'Сколько ожидаемых потерь за горизонт приходится на эту причину, евроценты' }

    Recommendation:
      type: object
      required: [code, title]
      properties:
        code: { type: string, description: 'Код признака, от которого идёт действие, или код действия для клиентов без оценки' }
        title: { type: string, description: Действие коротко }
        detail: { type: string, description: Подробности и цифры }
        service_id: { type: [integer, 'null'], format: int64, description: 'К какой услуге относится действие, если относится' }
        expected_saving:
          type: integer
          description: 'На сколько снизится ожидаемая потеря за горизонт, если причина исчезнет, евроценты'
        primary: { type: boolean, description: 'Главное действие по клиенту (наибольший денежный эффект)' }

    Money:
      type: object
      required: [monthly_revenue, exposure, expected_loss, explanation]
      properties:
        monthly_revenue: { type: integer, description: 'Выручка с живых услуг клиента, приведённая к месяцу, евроценты' }
        horizon_revenue: { type: integer, description: 'Выручка с живых услуг за горизонт, по которой взвешивается score, евроценты' }
        exposure: { type: integer, description: 'Максимум, что можно потерять за горизонт, если уйдут все услуги под риском, евроценты' }
        expected_loss: { type: integer, description: 'Ожидаемая потеря за горизонт с учётом вероятности и покрытия балансом, евроценты' }
        balance_coverage_days:
          type: [number, 'null']
          description: >-
            На сколько дней хватит баланса и разблокированных бонусов на автопродления по их
            фактическому графику (тот же расчёт, что дата в причине insufficient_funds). null —
            платных автопродлений нет или денег на них хватит больше чем на год (см. explanation)
        funds_run_out_at:
          type: [string, 'null']
          format: date-time
          description: 'Когда баланса не хватит на очередное автопродление; null — в пределах года не кончится или автопродлений нет'
        explanation: { type: string }

    CustomerSummary:
      type: object
      required: [id, email, balance, bonus_balance, withdraw_balance, total_replenished, risk_score, risk_level, loyalty, reasons, services_total, services_at_risk, monthly_revenue, expected_loss, exposure]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        balance: { type: integer, description: евроценты }
        bonus_balance: { type: integer, description: евроценты }
        bonus_state: { type: string, enum: [locked, unlocked] }
        withdraw_balance: { type: integer, description: евроценты }
        total_replenished: { type: integer, description: евроценты }
        risk_score: { type: [number, 'null'], minimum: 0, maximum: 100 }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        loyalty: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Обратная шкала: 100 − risk_score' }
        reasons:
          type: array
          description: Причины по убыванию вклада. Для unknown — причина отсутствия оценки (contribution = 0).
          items: { $ref: '#/components/schemas/Reason' }
        services_total: { type: integer }
        services_at_risk: { type: integer }
        monthly_revenue: { type: integer, description: евроценты }
        expected_loss: { type: integer, description: евроценты }
        exposure: { type: integer, description: евроценты }

    CustomerPage:
      type: object
      required: [items, total, page, page_size, scored_at, model_version]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerSummary' }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    CustomerAction:
      type: object
      required: [status, until, note, updated_at, updated_by, expected_loss_at_mark, risk_level_at_mark, active, return_reason]
      description: |
        Жизненный цикл: «Письмо отправлено» (emailed) держит клиента вне очереди, пока ждём ответа;
        «Решено» (resolved) — пока риск не вырастет; «Отложено» (snoozed) — до даты.
      properties:
        status: { type: string, enum: [emailed, resolved, snoozed] }
        until: { type: [string, 'null'], format: date-time, description: 'До какого момента клиент не показывается в очереди; null для resolved' }
        note: { type: [string, 'null'], description: 'Комментарий; для письма — его тема' }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }
        expected_loss_at_mark: { type: integer, description: 'Ожидаемая потеря в момент отметки, евроценты' }
        risk_level_at_mark: { $ref: '#/components/schemas/RiskLevel' }
        active: { type: boolean, description: 'Отметка сейчас прячет клиента из очереди' }
        return_reason:
          type: [string, 'null']
          enum: [risk_grew, no_reply, snooze_over, null]
          description: 'Почему клиент снова в очереди: риск вырос, на письмо не ответили за срок, отложка кончилась'

    CustomerActionUpdate:
      type: object
      additionalProperties: false
      required: [status]
      description: >-
        snoozed — ровно одно из snooze_days и snoozed_until; emailed — срок ожидания ответа
        (по умолчанию MAIL_FOLLOWUP_DAYS, 7 дней); resolved — без срока
      properties:
        status: { type: string, enum: [emailed, resolved, snoozed] }
        snooze_days: { type: integer, minimum: 1, maximum: 365 }
        snoozed_until: { type: string, format: date-time, description: 'В будущем, не дальше чем через 365 дней' }
        note: { type: string, maxLength: 500 }

    CustomerActionLogEntry:
      type: object
      required: [status, until, note, expected_loss, email_id, changed_at, changed_by]
      properties:
        status: { type: string, enum: [emailed, resolved, snoozed, cleared] }
        until: { type: [string, 'null'], format: date-time }
        note: { type: [string, 'null'], description: 'Комментарий; для письма — тема' }
        expected_loss: { type: [integer, 'null'], description: 'Ожидаемая потеря клиента в момент записи, евроценты' }
        email_id: { type: [integer, 'null'], format: int64, description: 'Письмо, после которого появилась запись' }
        changed_at: { type: string, format: date-time }
        changed_by: { type: [string, 'null'] }

    CustomerActionState:
      type: object
      required: [customer_id, action, history]
      properties:
        customer_id: { type: integer, format: int64 }
        action:
          oneOf:
            - { $ref: '#/components/schemas/CustomerAction' }
            - { type: 'null' }
        history:
          type: array
          description: Журнал от новых записей к старым
          items: { $ref: '#/components/schemas/CustomerActionLogEntry' }

    ContactTodayItem:
      type: object
      required: [id, email, risk_level, risk_score, expected_loss, main_reason, main_reason_code, next_action, action]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        risk_score: { type: [number, 'null'], minimum: 0, maximum: 100 }
        expected_loss: { type: integer, description: евроценты }
        main_reason: { type: [string, 'null'], description: Короткое название главной причины риска }
        main_reason_code: { type: [string, 'null'], description: Код главной причины — по нему выбирается шаблон письма }
        next_action:
          description: Главное действие из карточки клиента
          oneOf:
            - { $ref: '#/components/schemas/Recommendation' }
            - { type: 'null' }
        action:
          oneOf:
            - { $ref: '#/components/schemas/CustomerAction' }
            - { type: 'null' }

    ContactToday:
      type: object
      required: [items, queue_total, queue_expected_loss, marked_total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ContactTodayItem' }
        queue_total: { type: integer, description: Сколько клиентов в очереди всего (без отмеченных) }
        queue_expected_loss: { type: integer, description: Ожидаемая потеря по всей очереди, евроценты }
        marked_total: { type: integer, description: Сколько клиентов сейчас спрятано отметками }

    MailTemplate:
      type: object
      required: [code, title, subject, body, is_default, updated_at, updated_by]
      properties:
        code:
          type: string
          description: 'Код причины риска, к которой относится шаблон, или general / win_back'
          examples: [insufficient_funds]
        title: { type: string, description: 'Название для панели' }
        subject: { type: string, description: 'Тема с подстановками {{…}}' }
        body: { type: string, description: 'Текст с подстановками {{…}}' }
        is_default: { type: boolean, description: 'Текст совпадает с исходным' }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }

    MailTemplatePatch:
      type: object
      additionalProperties: false
      required: [subject, body]
      properties:
        subject: { type: string, minLength: 1, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 10000 }

    MailTemplates:
      type: object
      required: [items, placeholders]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MailTemplate' }
        placeholders:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string, examples: [service] }
              description: { type: string }

    EmailDraftRequest:
      type: object
      additionalProperties: false
      properties:
        template_code: { type: [string, 'null'], description: 'Не указан — шаблон по главной причине риска' }

    EmailDraft:
      type: object
      required: [customer_id, to, reply_to, from, template_code, subject, text, last_sent_at, enabled]
      properties:
        customer_id: { type: integer, format: int64 }
        to: { type: string }
        reply_to: { type: string, description: 'Куда придёт ответ клиента: почта сотрудника, SMTP_REPLY_TO или SMTP_FROM' }
        from: { type: string }
        template_code: { type: string }
        subject: { type: string }
        text: { type: string }
        last_sent_at: { type: [string, 'null'], format: date-time, description: 'Когда клиенту писали в последний раз' }
        enabled: { type: boolean, description: 'Настроена ли отправка (SMTP_HOST)' }

    EmailSendRequest:
      type: object
      additionalProperties: false
      required: [subject, text]
      properties:
        template_code: { type: [string, 'null'] }
        subject: { type: string, minLength: 1, maxLength: 200 }
        text: { type: string, minLength: 1, maxLength: 10000, description: 'Оставшиеся подстановки {{…}} заполнятся при отправке' }

    CustomerEmail:
      type: object
      required: [id, customer_id, campaign_id, to, reply_to, template_code, subject, status, skip_reason, error, created_at, created_by, sent_at]
      properties:
        id: { type: integer, format: int64 }
        customer_id: { type: integer, format: int64 }
        campaign_id: { type: [integer, 'null'], format: int64 }
        to: { type: string }
        reply_to: { type: [string, 'null'] }
        template_code: { type: [string, 'null'] }
        subject: { type: string }
        status: { type: string, enum: [queued, sending, sent, failed, skipped] }
        skip_reason: { type: [string, 'null'], enum: [recent, no_email, null] }
        error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }
        sent_at: { type: [string, 'null'], format: date-time }

    EmailSent:
      type: object
      required: [email, state]
      properties:
        email: { $ref: '#/components/schemas/CustomerEmail' }
        state: { $ref: '#/components/schemas/CustomerActionState' }

    CampaignRequest:
      type: object
      additionalProperties: false
      description: 'Кому писать: выбранным (customer_ids) или всей очереди (worklist: true) — что-то одно'
      properties:
        customer_ids:
          type: array
          minItems: 1
          maxItems: 5000
          items: { type: integer, format: int64 }
        worklist: { type: boolean, default: false }
        template_code: { type: [string, 'null'], description: 'Один шаблон для всех; не указан — по главной причине каждого клиента' }
        skip_days:
          type: integer
          minimum: 0
          maximum: 90
          default: 7
          description: 'Не писать тем, кому уже писали за столько дней (0 — писать всем)'

    CampaignPreview:
      type: object
      required: [total, to_send, skipped_recent, skipped_no_email, not_found, templates, sample, enabled]
      properties:
        total: { type: integer }
        to_send: { type: integer }
        skipped_recent: { type: integer, description: 'Писали недавно (skip_days)' }
        skipped_no_email: { type: integer }
        not_found: { type: integer, description: 'Таких id нет среди оценённых клиентов' }
        templates:
          type: array
          items:
            type: object
            required: [code, count]
            properties:
              code: { type: string }
              count: { type: integer }
        sample:
          description: Первое письмо рассылки, как его увидит клиент
          oneOf:
            - type: object
              required: [customer_id, to, template_code, subject, text]
              properties:
                customer_id: { type: integer, format: int64 }
                to: { type: string }
                template_code: { type: string }
                subject: { type: string }
                text: { type: string }
            - { type: 'null' }
        enabled: { type: boolean }

    Campaign:
      type: object
      required: [id, template_code, skip_days, created_at, created_by, finished_at, status, total, queued, sending, sent, failed, skipped]
      properties:
        id: { type: integer, format: int64 }
        template_code: { type: [string, 'null'] }
        skip_days: { type: integer }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, 'null'] }
        finished_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [running, done] }
        total: { type: integer }
        queued: { type: integer }
        sending: { type: integer }
        sent: { type: integer }
        failed: { type: integer }
        skipped: { type: integer }

    MailStats:
      type: object
      required: [period_days, sent, failed, queued, customers, risk_down, topped_up, helped, helped_share]
      description: |
        Помогло ли письмо: у клиента после последнего письма за период снизился risk-score
        или вырос баланс (по последующим данным). Простая оценка: она не отделяет эффект
        письма от того, что клиент сделал бы и сам.
      properties:
        period_days: { type: integer }
        sent: { type: integer, description: 'Писем отправлено за период' }
        failed: { type: integer }
        queued: { type: integer, description: 'Ждут отправки в рассылках' }
        customers: { type: integer, description: 'Скольким клиентам писали' }
        risk_down: { type: integer }
        topped_up: { type: integer }
        helped: { type: integer, description: 'risk_down или topped_up' }
        helped_share: { type: [number, 'null'], minimum: 0, maximum: 1 }

    ServiceRisk:
      type: object
      required: [id, name, status, payment_term, price, auto_prolong, created_at, expires_at, risk_score, risk_level, reasons, expected_loss, monthly_price]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        payment_term: { $ref: '#/components/schemas/PaymentTerm' }
        price: { type: integer, description: 'Цена за период оплаты, евроценты' }
        monthly_price: { type: integer, description: 'Цена, приведённая к месяцу, евроценты' }
        auto_prolong: { type: boolean }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        days_to_expiry: { type: [number, 'null'], description: 'Отрицательное — уже истекла' }
        risk_score: { type: [number, 'null'] }
        risk_level: { $ref: '#/components/schemas/RiskLevel' }
        reasons:
          type: array
          items: { $ref: '#/components/schemas/Reason' }
        expected_loss: { type: integer, description: евроценты }
        horizon_revenue:
          type: integer
          description: 'Выручка услуги за горизонт, которую реально можно получить: по цене, но не больше, чем клиент способен заплатить; евроценты'
        revenue_note:
          type: [string, 'null']
          description: 'Пояснение, если выручку ограничила платёжеспособность клиента'

    FeatureContribution:
      type: object
      required: [code, title, group, value, weight, contribution, explanation]
      properties:
        code: { type: string }
        title: { type: string }
        group: { type: string }
        value: { type: number, minimum: 0, maximum: 1, description: 'Сила сигнала 0..1' }
        weight: { type: number, description: 'Действующий коэффициент' }
        contribution: { type: number, description: 'Вклад в итоговый score, пунктов' }
        explanation: { type: string }

    Transaction:
      type: object
      required: [id, type, status, amount, created_at, service_id]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [prolong, order] }
        status: { type: string, enum: [performed, not_performed] }
        amount: { type: integer, description: евроценты }
        created_at: { type: string, format: date-time }
        performed_at: { type: [string, 'null'], format: date-time }
        service_id: { type: integer, format: int64 }

    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/CustomerSummary'
        - type: object
          required: [services, features, transactions, money, recommendations, scored_at, model_version]
          properties:
            services:
              type: array
              items: { $ref: '#/components/schemas/ServiceRisk' }
            features:
              type: array
              description: Разложение score по признакам
              items: { $ref: '#/components/schemas/FeatureContribution' }
            transactions:
              type: array
              description: Последние транзакции (до 50), от новых к старым
              items: { $ref: '#/components/schemas/Transaction' }
            money: { $ref: '#/components/schemas/Money' }
            recommendations:
              type: array
              description: 'Что предпринять маркетологу, по убыванию денежного эффекта; первое — главное'
              items: { $ref: '#/components/schemas/Recommendation' }
            next_action:
              description: 'Одно главное действие по клиенту (то же, что первое в recommendations)'
              anyOf:
                - $ref: '#/components/schemas/Recommendation'
                - type: 'null'
            scored_at: { type: [string, 'null'], format: date-time }
            model_version: { type: integer }

    TimelinePoint:
      type: object
      required: [date, kind]
      properties:
        date: { type: string, format: date }
        kind: { type: string, enum: [fact, forecast] }
        deletions: { type: [integer, 'null'], description: 'Факт: удалённые услуги за день' }
        estimated_deletions: { type: [integer, 'null'], description: 'Факт: сколько из deletions датированы оценкой (услуга пришла в снимке уже удалённой, дата = окончание оплаты + 5 дней)' }
        at_risk_services: { type: [integer, 'null'], description: 'Услуги под риском (high+medium) на дату. В зоне факта известно только на день снимка, в прочие дни null' }
        expected_nonrenewals: { type: [number, 'null'], description: 'Прогноз: ожидаемое число непродлений за день' }
        expected_loss: { type: [integer, 'null'], description: 'Прогноз: ожидаемая потеря за день, евроценты' }

    Summary:
      type: object
      required: [customers_total, by_level, services_total, services_at_risk, expected_loss, exposure, monthly_revenue_total, horizon_days, money_explanation, top_reasons, timeline, scored_at, model_version]
      properties:
        customers_total: { type: integer }
        by_level:
          type: object
          required: [high, medium, low, unknown]
          properties:
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            unknown: { type: integer }
        services_total: { type: integer }
        services_at_risk: { type: integer }
        expected_loss: { type: integer, description: евроценты }
        exposure: { type: integer, description: евроценты }
        monthly_revenue_total: { type: integer, description: евроценты }
        revenue_at_risk_share: { type: number, minimum: 0, maximum: 1 }
        horizon_days: { type: integer }
        money_explanation: { type: string }
        top_reasons:
          type: array
          description: 'Причины риска по базе, по убыванию ожидаемых потерь. Причин без клиентов в списке нет'
          items:
            type: object
            required: [code, title, customers]
            properties:
              code: { type: string }
              title: { type: string }
              customers: { type: integer, description: 'У скольких оценённых клиентов причина есть в разложении score' }
              primary_customers: { type: integer, description: 'У скольких клиентов эта причина главная (первая в reasons)' }
              expected_loss: { type: integer, description: 'Ожидаемые потери, которые приходятся на причину у этих клиентов, евроценты' }
        risk_scores:
          type: object
          description: 'Распределение risk_score оценённых клиентов (без unknown); из него же /metrics отдаёт churn_risk_score_*'
          required: [scored, avg, max, buckets]
          properties:
            scored: { type: integer, description: 'Сколько клиентов оценено' }
            avg: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Средний score; null, если оценённых нет' }
            max: { type: [number, 'null'], minimum: 0, maximum: 100 }
            buckets:
              type: array
              description: 'Накопленные корзины 10, 20, …, 100: count — клиентов со score не выше le'
              items:
                type: object
                required: [le, count]
                properties:
                  le: { type: number }
                  count: { type: integer }
        timeline:
          type: array
          items: { $ref: '#/components/schemas/TimelinePoint' }
        deleted_services:
          type: object
          description: 'Удалённые услуги в снимке, в том числе удалённые раньше окна факта в timeline'
          required: [total, last_date, last_estimated]
          properties:
            total: { type: integer, description: 'Сколько услуг в статусе deleted' }
            last_date: { type: [string, 'null'], format: date, description: 'Дата последнего удаления; null, если удалённых нет' }
            last_estimated: { type: boolean, description: 'Дата последнего удаления — оценка по окончанию оплаты, а не замеченная смена статуса' }
        scored_at: { type: [string, 'null'], format: date-time }
        model_version: { type: integer }

    FeatureWeight:
      type: object
      required: [code, title, description, group, weight, min, max, enabled]
      properties:
        code: { type: string }
        title: { type: string }
        description: { type: string }
        group: { type: string, examples: [renewal, finance, behavior] }
        level: { type: string, enum: [service, account] }
        weight: { type: number }
        default_weight: { type: number }
        min: { type: number }
        max: { type: number }
        enabled: { type: boolean }

    ModelSettings:
      type: object
      required: [version, updated_at, horizon_days, thresholds, weights]
      properties:
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, 'null'] }
        horizon_days: { type: integer, minimum: 1, maximum: 365 }
        thresholds:
          type: object
          required: [medium, high]
          description: 'score ≥ high → high; ≥ medium → medium; иначе low'
          properties:
            medium: { type: number, minimum: 0, maximum: 100 }
            high: { type: number, minimum: 0, maximum: 100 }
        weights:
          type: array
          items: { $ref: '#/components/schemas/FeatureWeight' }

    ModelSettingsPatch:
      type: object
      minProperties: 1
      properties:
        horizon_days: { type: integer, minimum: 1, maximum: 365 }
        thresholds:
          type: object
          properties:
            medium: { type: number, minimum: 0, maximum: 100 }
            high: { type: number, minimum: 0, maximum: 100 }
        weights:
          type: array
          items:
            type: object
            required: [code]
            properties:
              code: { type: string }
              weight: { type: number }
              enabled: { type: boolean }

    PreviewTotals:
      type: object
      required: [horizon_days, thresholds, expected_loss, exposure, services_at_risk, revenue_at_risk_share, by_level]
      properties:
        horizon_days: { type: integer }
        thresholds:
          type: object
          required: [medium, high]
          properties:
            medium: { type: number }
            high: { type: number }
        expected_loss: { type: integer, description: 'Ожидаемая потеря за горизонт, евроценты' }
        exposure: { type: integer, description: 'Выручка услуг среднего и высокого риска, евроценты' }
        services_at_risk: { type: integer }
        revenue_at_risk_share: { type: number, minimum: 0, maximum: 1 }
        by_level:
          type: object
          required: [high, medium, low, unknown]
          properties:
            high: { type: integer }
            medium: { type: integer }
            low: { type: integer }
            unknown: { type: integer }

    PreviewCustomerChange:
      type: object
      required: [id, email, level_before, level_after, score_before, score_after, expected_loss_before, expected_loss_after]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        level_before: { $ref: '#/components/schemas/RiskLevel' }
        level_after: { $ref: '#/components/schemas/RiskLevel' }
        score_before: { type: [number, 'null'] }
        score_after: { type: [number, 'null'] }
        expected_loss_before: { type: integer }
        expected_loss_after: { type: integer }

    ModelSettingsPreview:
      type: object
      required: [model_version, exact, customers_total, sample_size, before, after, changes_total, into_high, out_of_high, changes, duration_ms]
      properties:
        model_version: { type: integer, description: 'Версия настроек, от которой считается «было»' }
        exact:
          type: boolean
          description: |
            `false` — база больше PREVIEW_SAMPLE_SIZE клиентов: посчитана выборка, счётчики
            и деньги масштабированы на всю базу, список клиентов — только из выборки.
        customers_total: { type: integer }
        sample_size: { type: integer, description: 'Сколько клиентов посчитано на самом деле' }
        before: { $ref: '#/components/schemas/PreviewTotals' }
        after: { $ref: '#/components/schemas/PreviewTotals' }
        changes_total: { type: integer, description: 'Сколько посчитанных клиентов сменят уровень' }
        into_high: { type: integer }
        out_of_high: { type: integer }
        changes:
          type: array
          maxItems: 50
          description: 'Сначала попадающие в высокий риск, потом выходящие из него, внутри — по изменению потери'
          items: { $ref: '#/components/schemas/PreviewCustomerChange' }
        duration_ms: { type: number }

    SettingsChange:
      type: object
      required: [version, changed_at, changed_by, changes]
      properties:
        version: { type: integer }
        changed_at: { type: string, format: date-time }
        changed_by: { type: [string, 'null'] }
        changes:
          type: array
          items:
            type: object
            required: [path, old, new]
            properties:
              path: { type: string, examples: ['weights.autoprolong_off_expiring.weight'] }
              old: {}
              new: {}

    QualityRanking:
      type: object
      description: 'Качество ранжирования одного метода; доли от 0 до 1'
      required: [roc_auc, pr_auc, precision_top5, recall_top5, precision_top10, recall_top10]
      properties:
        roc_auc: { type: [number, 'null'] }
        pr_auc: { type: [number, 'null'] }
        precision_top5: { type: [number, 'null'], description: 'Доля ушедших среди 5 % клиентов с наибольшим score' }
        recall_top5: { type: [number, 'null'] }
        precision_top10: { type: [number, 'null'] }
        recall_top10: { type: [number, 'null'] }
        roc_auc_ci: { type: [array, 'null'], items: { type: [number, 'null'] }, minItems: 2, maxItems: 2, description: '95 % бутстреп-интервал, только у модели' }
        pr_auc_ci: { type: [array, 'null'], items: { type: [number, 'null'] }, minItems: 2, maxItems: 2 }

    QualityRankingSet:
      type: object
      description: 'model — score модели; autoprolong_off и prolong_wait — простые правила; random — случайный порядок; segment_oracle — скрытый сегмент генератора, модели недоступен'
      required: [model, autoprolong_off, prolong_wait, random, segment_oracle]
      properties:
        model: { $ref: '#/components/schemas/QualityRanking' }
        autoprolong_off: { $ref: '#/components/schemas/QualityRanking' }
        prolong_wait: { $ref: '#/components/schemas/QualityRanking' }
        random: { $ref: '#/components/schemas/QualityRanking' }
        segment_oracle: { $ref: '#/components/schemas/QualityRanking' }

    QualityTargets:
      type: object
      description: 'churned — ушёл полностью (потеряны все услуги, действовавшие на T); lost_any — потерял хотя бы одну'
      required: [churned, lost_any]
      properties:
        churned: { $ref: '#/components/schemas/QualityRankingSet' }
        lost_any: { $ref: '#/components/schemas/QualityRankingSet' }

    QualityLevel:
      type: object
      required: [level, n]
      properties:
        level: { type: string, enum: [low, medium, high, all] }
        n: { type: integer }
        share_of_base: { type: [number, 'null'] }
        churn_rate: { type: [number, 'null'] }
        churn_lift: { type: [number, 'null'], description: 'Во сколько раз чаще уходят полностью, чем в среднем по базе' }
        lost_any_rate: { type: [number, 'null'] }
        lost_any_lift: { type: [number, 'null'] }
        revenue: { type: [number, 'null'], description: 'Выручка за горизонт, евроценты' }
        expected_loss: { type: [number, 'null'], description: 'Прогноз потерь модели, евроценты' }
        actual_loss: { type: [number, 'null'], description: 'Фактически потеряно в симуляции, евроценты' }
        predicted_share: { type: [number, 'null'] }
        actual_share: { type: [number, 'null'] }

    QualityRates:
      type: object
      required: [churned, lost_any]
      properties:
        churned: { type: [number, 'null'] }
        lost_any: { type: [number, 'null'] }
        revenue_lost_share: { type: [number, 'null'] }

    QualityPrecisionRecall:
      type: object
      required: [precision, recall]
      properties:
        precision: { type: [number, 'null'] }
        recall: { type: [number, 'null'] }

    QualityThreshold:
      type: object
      required: [flagged, flagged_share, churned, lost_any]
      properties:
        flagged: { type: integer, description: 'Сколько клиентов попадает под порог' }
        flagged_share: { type: [number, 'null'] }
        churned: { $ref: '#/components/schemas/QualityPrecisionRecall' }
        lost_any: { $ref: '#/components/schemas/QualityPrecisionRecall' }

    QualityScenario:
      type: object
      required: [accounts, services, base_rates, ranking, levels, calibration, roc, thresholds, hard_subset]
      properties:
        accounts: { type: integer }
        services: { type: integer }
        base_rates: { $ref: '#/components/schemas/QualityRates' }
        ranking: { $ref: '#/components/schemas/QualityTargets' }
        levels:
          type: array
          items: { $ref: '#/components/schemas/QualityLevel' }
        calibration:
          type: array
          description: 'Децили score: прогноз и факт доли потерянной выручки'
          items:
            type: object
            required: [group, n, score_min, score_max, predicted_share, actual_share]
            properties:
              group: { type: integer }
              n: { type: integer }
              score_min: { type: number }
              score_max: { type: number }
              predicted_share: { type: [number, 'null'] }
              actual_share: { type: [number, 'null'] }
        roc:
          type: object
          description: 'ROC-кривые на общей сетке FPR, цель churned'
          required: [target, fpr, tpr]
          properties:
            target: { type: string, enum: [churned, lost_any] }
            fpr: { type: array, items: { type: number } }
            tpr:
              type: object
              required: [model, autoprolong_off, prolong_wait, segment_oracle]
              properties:
                model: { type: array, items: { type: number } }
                autoprolong_off: { type: array, items: { type: number } }
                prolong_wait: { type: array, items: { type: number } }
                segment_oracle: { type: array, items: { type: number } }
        thresholds:
          type: object
          description: 'Если работать со всеми клиентами уровня high (или medium и выше)'
          required: [high, medium_plus]
          properties:
            high: { $ref: '#/components/schemas/QualityThreshold' }
            medium_plus: { $ref: '#/components/schemas/QualityThreshold' }
        hard_subset:
          type: object
          description: 'Клиенты, у которых на T ничего не ждёт оплаты'
          required: [description, accounts, base_rates, ranking, levels]
          properties:
            description: { type: string }
            accounts: { type: integer }
            base_rates: { $ref: '#/components/schemas/QualityRates' }
            ranking: { $ref: '#/components/schemas/QualityTargets' }
            levels:
              type: array
              items: { $ref: '#/components/schemas/QualityLevel' }

    QualityRobustnessScenario:
      type: object
      required: [roc_auc, pr_auc, churn_lift_high, base_churned]
      properties:
        roc_auc: { type: [number, 'null'] }
        pr_auc: { type: [number, 'null'] }
        churn_lift_high: { type: [number, 'null'] }
        base_churned: { type: [number, 'null'] }

    ModelQuality:
      type: object
      required: [params, scenarios, robustness, current_model]
      properties:
        params:
          type: object
          required: [accounts, seed, reference, horizon_days, stream_rate, background_rate, concentration, bootstrap, riskcore_version, riskcore_sources, simulator_sources, weights, thresholds]
          properties:
            accounts: { type: integer }
            seed: { type: integer }
            reference: { type: string, description: 'Момент T, ISO 8601' }
            horizon_days: { type: integer }
            stream_rate: { type: number, description: 'Изменений живого потока на услугу в сутки (stream)' }
            background_rate: { type: number }
            concentration: { type: number, description: 'Разброс поведения внутри сегмента (calendar)' }
            bootstrap: { type: integer }
            riskcore_version: { type: string }
            riskcore_sources: { type: string, description: 'Отпечаток исходников riskcore, на которых шла проверка' }
            simulator_sources: { type: string }
            weights: { type: object, additionalProperties: { type: number }, description: 'Веса признаков при проверке' }
            thresholds:
              type: object
              required: [medium, high]
              properties:
                medium: { type: number }
                high: { type: number }
        scenarios:
          type: object
          description: 'stream — живой поток симулятора; calendar — продления строго по сроку, решение по скрытому поведению сегмента'
          required: [stream, calendar]
          properties:
            stream: { $ref: '#/components/schemas/QualityScenario' }
            calendar: { $ref: '#/components/schemas/QualityScenario' }
        robustness:
          type: array
          description: 'Основной прогон и соседние: другие seed, темп потока, разброс поведения'
          items:
            type: object
            required: [label, seed, stream_rate, concentration, scenarios]
            properties:
              label: { type: string }
              seed: { type: integer }
              stream_rate: { type: number }
              concentration: { type: number }
              scenarios:
                type: object
                properties:
                  stream: { $ref: '#/components/schemas/QualityRobustnessScenario' }
                  calendar: { $ref: '#/components/schemas/QualityRobustnessScenario' }
        current_model:
          type: object
          required: [riskcore_sources, matches]
          properties:
            riskcore_sources: { type: [string, 'null'], description: 'Отпечаток установленного riskcore' }
            matches: { type: [boolean, 'null'], description: 'Совпадает ли с тем, на котором считались цифры' }

    SourceAccount:
      type: object
      required: [id, email, balance, withdrawBalance, totalReplenished, bonusBalance, bonusState]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        balance: { type: integer, minimum: 0 }
        withdrawBalance: { type: integer, minimum: 0 }
        totalReplenished: { type: integer, minimum: 0 }
        bonusBalance: { type: integer, minimum: 0 }
        bonusState: { type: string, enum: [locked, unlocked] }

    SourceService:
      type: object
      required: [id, name, ownerId, paymentTerm, autoProlong, createdAt, expiresAt, status, price]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        ownerId: { type: integer, format: int64 }
        paymentTerm: { $ref: '#/components/schemas/PaymentTerm' }
        autoProlong: { type: boolean }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/ServiceStatus' }
        price: { type: integer, minimum: 0 }

    SourceTransaction:
      type: object
      required: [id, amount, status, createdAt, type, serviceId]
      properties:
        id: { type: integer, format: int64 }
        amount: { type: integer, minimum: 0 }
        status: { type: string, enum: [performed, not_performed] }
        performedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        type: { type: string, enum: [prolong, order] }
        serviceId: { type: integer, format: int64 }

    SourceSnapshot:
      type: object
      required: [accounts, services, transactions]
      properties:
        reference_time:
          type: [string, 'null']
          format: date-time
          description: 'Момент, на который снят снимок. Если не задан — текущее время.'
        accounts:
          type: array
          items: { $ref: '#/components/schemas/SourceAccount' }
        services:
          type: array
          items: { $ref: '#/components/schemas/SourceService' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/SourceTransaction' }

    SourceChangeBatch:
      type: object
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/SourceAccount' }
        services:
          type: array
          items: { $ref: '#/components/schemas/SourceService' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/SourceTransaction' }

    SnapshotAccepted:
      type: object
      required: [snapshot_id, counts]
      properties:
        snapshot_id: { type: string }
        counts:
          type: object
          required: [accounts, services, transactions]
          properties:
            accounts: { type: integer }
            services: { type: integer }
            transactions: { type: integer }

    SimulatorState:
      type: object
      required: [running, interval_ms, events_emitted]
      properties:
        running: { type: boolean }
        interval_ms: { type: integer }
        events_emitted: { type: integer }

    SimulatorCommand:
      type: object
      properties:
        running: { type: boolean }
        interval_ms: { type: integer, minimum: 200, maximum: 60000 }
        generate:
          type: object
          description: Сгенерировать и загрузить расширенный набор вместо текущего
          properties:
            accounts: { type: integer, minimum: 1, maximum: 200000 }
            seed: { type: integer }

    ScoresUpdatedEvent:
      type: object
      required: [model_version, scored_at, changed_customer_ids, summary]
      properties:
        model_version: { type: integer }
        scored_at: { type: string, format: date-time }
        changed_customer_ids:
          type: array
          description: 'Пустой массив с full=true — пересчитаны все'
          items: { type: integer }
        full: { type: boolean }
        duration_ms: { type: number }
        summary:
          type: object
          required: [customers_total, by_level, expected_loss, exposure]
          properties:
            customers_total: { type: integer }
            by_level:
              type: object
              properties:
                high: { type: integer }
                medium: { type: integer }
                low: { type: integer }
                unknown: { type: integer }
            expected_loss: { type: integer }
            exposure: { type: integer }

    SettingsUpdatedEvent:
      type: object
      required: [version, updated_by]
      properties:
        version: { type: integer }
        updated_by: { type: [string, 'null'] }

    SourceUpdatedEvent:
      type: object
      required: [kind, counts]
      properties:
        kind: { type: string, enum: [snapshot, changes] }
        snapshot_id: { type: [string, 'null'] }
        counts:
          type: object
          properties:
            accounts: { type: integer }
            services: { type: integer }
            transactions: { type: integer }

    AlertItem:
      type: object
      required: [id, kind, message, link]
      properties:
        id: { type: integer }
        kind: { type: string, enum: [high_risk, loss_jump, total_loss_jump, bulk] }
        customer_id: { type: [integer, 'null'], description: 'null у total_loss_jump и bulk' }
        email: { type: [string, 'null'] }
        risk_level: { type: [string, 'null'] }
        prev_level: { type: [string, 'null'] }
        expected_loss: { type: [integer, 'null'], description: евроценты }
        prev_loss: { type: [integer, 'null'], description: 'евроценты, точка отсчёта роста' }
        message: { type: string }
        created_at: { type: [string, 'null'], format: date-time }
        link: { type: string, description: 'путь в панели: /customers/{id}, для сводных — отфильтрованный список /customers?level=high...' }

    AlertPage:
      type: object
      required: [items, total, page, page_size, latest_id, channels]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AlertItem' } }
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        latest_id: { type: [integer, 'null'] }
        channels:
          type: object
          required: [feed, webhook, telegram]
          properties:
            feed: { type: boolean }
            webhook: { type: boolean }
            telegram: { type: boolean }
