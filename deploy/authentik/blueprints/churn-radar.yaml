# Настройка Authentik для ChurnRadar без кликов в админке.
# Воркер Authentik подхватывает файл из /blueprints/churn-radar и применяет его сам:
# группы, демо-пользователи, OIDC- и SAML-провайдеры с приложениями, маппинги групп в роли.
# Все адреса и пароли берутся из переменных окружения, значения по умолчанию — только для демо.
version: 1
metadata:
  name: ChurnRadar - SSO
  labels:
    blueprints.goauthentik.io/description: "Группы, демо-пользователи, OIDC и SAML для ChurnRadar"
context:
  panel_url: !Env [CHURN_RADAR_PUBLIC_URL, "http://localhost:8080"]
  oidc_client_id: !Env [CHURN_RADAR_OIDC_CLIENT_ID, "churn-radar"]
  oidc_client_secret: !Env [CHURN_RADAR_OIDC_CLIENT_SECRET, "churn-radar-demo-secret"]
  saml_issuer: !Env [CHURN_RADAR_SAML_IDP_ISSUER, "churn-radar-authentik"]
  admin_password: !Env [CHURN_RADAR_SSO_ADMIN_PASSWORD, "admin"]
  marketer_password: !Env [CHURN_RADAR_SSO_MARKETER_PASSWORD, "marketer"]
  analyst_password: !Env [CHURN_RADAR_SSO_ANALYST_PASSWORD, "analyst"]
  outsider_password: !Env [CHURN_RADAR_SSO_OUTSIDER_PASSWORD, "outsider"]
entries:
  # потоки, маппинги и самоподписанный сертификат из стандартных blueprint'ов должны появиться раньше
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider authorization flow (implicit consent)
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: Default - Provider invalidation flow
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - OAuth2 Provider - Scopes
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: System - SAML Provider - Mappings
      required: true

  # ---------------------------------------------------------------- группы = роли панели
  - model: authentik_core.group
    id: group-admins
    identifiers:
      name: churn-admins
    attrs:
      attributes:
        churn_radar_role: admin

  - model: authentik_core.group
    id: group-marketers
    identifiers:
      name: churn-marketers
    attrs:
      attributes:
        churn_radar_role: marketer

  - model: authentik_core.group
    id: group-analysts
    identifiers:
      name: churn-analysts
    attrs:
      attributes:
        churn_radar_role: analyst

  # ---------------------------------------------------------------- демо-пользователи
  - model: authentik_core.user
    identifiers:
      username: admin
    attrs:
      name: Администратор (SSO)
      email: admin@churn-radar.local
      path: churn-radar
      groups:
        - !KeyOf group-admins
      password: !Context admin_password

  - model: authentik_core.user
    identifiers:
      username: marketer
    attrs:
      name: Мария Маркетолог
      email: marketer@churn-radar.local
      path: churn-radar
      groups:
        - !KeyOf group-marketers
      password: !Context marketer_password

  - model: authentik_core.user
    identifiers:
      username: analyst
    attrs:
      name: Алексей Аналитик
      email: analyst@churn-radar.local
      path: churn-radar
      groups:
        - !KeyOf group-analysts
      password: !Context analyst_password

  # без групп: Authentik его пустит, а панель откажет — так видно, что доступ решают группы
  - model: authentik_core.user
    identifiers:
      username: outsider
    attrs:
      name: Посторонний
      email: outsider@churn-radar.local
      path: churn-radar
      groups: []
      password: !Context outsider_password

  # ---------------------------------------------------------------- маппинги групп в роли
  # OIDC: scope churn-radar добавляет в токен claim roles. Группы приходят и так (scope profile),
  # auth понимает оба варианта.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-roles
    identifiers:
      name: "ChurnRadar: роли из групп (OIDC)"
    attrs:
      scope_name: churn-radar
      description: Роль в ChurnRadar
      expression: |
        names = {group.name for group in request.user.groups.all()}
        roles = []
        if "churn-admins" in names:
            roles.append("admin")
        if "churn-marketers" in names:
            roles.append("marketer")
        if "churn-analysts" in names:
            roles.append("analyst")
        return {"roles": roles}

  # SAML: атрибут churn-radar-role со значениями admin / marketer / analyst
  - model: authentik_providers_saml.samlpropertymapping
    id: saml-roles
    identifiers:
      name: "ChurnRadar: роли из групп (SAML)"
    attrs:
      saml_name: churn-radar-role
      friendly_name: role
      expression: |
        names = {group.name for group in request.user.groups.all()}
        if "churn-admins" in names:
            yield "admin"
        if "churn-marketers" in names:
            yield "marketer"
        if "churn-analysts" in names:
            yield "analyst"

  # ---------------------------------------------------------------- OIDC
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-oidc
    identifiers:
      name: ChurnRadar OIDC
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Context oidc_client_id
      client_secret: !Context oidc_client_secret
      redirect_uris:
        - matching_mode: strict
          url: !Format ["%s/api/v1/auth/oidc/callback", !Context panel_url]
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      # без ключа Authentik подписывает id_token через HS256 секретом клиента; auth принимает только RS/ES/PS
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf scope-roles

  - model: authentik_core.application
    identifiers:
      slug: churn-radar
    attrs:
      name: ChurnRadar
      provider: !KeyOf provider-oidc
      meta_launch_url: !Context panel_url
      meta_description: Панель оттока клиентов (вход через OIDC)
      policy_engine_mode: any

  # ---------------------------------------------------------------- SAML
  - model: authentik_providers_saml.samlprovider
    id: provider-saml
    identifiers:
      name: ChurnRadar SAML
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      acs_url: !Format ["%s/api/v1/auth/saml/acs", !Context panel_url]
      audience: !Format ["%s/api/v1/auth/saml/metadata", !Context panel_url]
      issuer_override: !Context saml_issuer
      sp_binding: post
      sign_assertion: true
      sign_response: false
      digest_algorithm: http://www.w3.org/2001/04/xmlenc#sha256
      signature_algorithm: http://www.w3.org/2001/04/xmldsig-more#rsa-sha256
      default_name_id_policy: urn:oasis:names:tc:SAML:2.0:nameid-format:persistent
      signing_kp: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/username]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/name]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/email]]
        - !Find [authentik_providers_saml.samlpropertymapping, [managed, goauthentik.io/providers/saml/groups]]
        - !KeyOf saml-roles

  - model: authentik_core.application
    identifiers:
      slug: churn-radar-saml
    attrs:
      name: ChurnRadar (SAML)
      provider: !KeyOf provider-saml
      meta_launch_url: !Context panel_url
      meta_description: Панель оттока клиентов (вход через SAML)
      policy_engine_mode: any
