{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cr.secretName" . }}
  labels:
    {{- include "cr.metaLabels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "cr.databaseUrl" . | quote }}
  REDIS_URL: {{ include "cr.redisUrl" . | quote }}
  METRICS_TOKEN: {{ .Values.secrets.metricsToken | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  MARKETER_PASSWORD: {{ .Values.secrets.marketerPassword | quote }}
  ANALYST_PASSWORD: {{ .Values.secrets.analystPassword | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
{{- end }}
{{- $alerts := .Values.secrets.alerts }}
{{- if and .Values.alerts.enabled (not $alerts.existingSecret) }}
---
# Каналы alerts. Пустые ключи не пишем: сервис считает канал выключенным, если переменной нет.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cr.alertsSecretName" . }}
  labels:
    {{- include "cr.metaLabels" . | nindent 4 }}
type: Opaque
{{- $data := dict }}
{{- range $key, $value := dict "WEBHOOK_URL" $alerts.webhookUrl "WEBHOOK_SECRET" $alerts.webhookSecret "TELEGRAM_BOT_TOKEN" $alerts.telegramBotToken "TELEGRAM_CHAT_ID" $alerts.telegramChatId "SMTP_PASSWORD" $alerts.smtpPassword }}
{{- if $value }}{{ $_ := set $data $key (toString $value) }}{{ end }}
{{- end }}
stringData:
  {{- toYaml $data | nindent 2 }}
{{- end }}
