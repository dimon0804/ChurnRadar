{{- $sso := .Values.sso }}
{{- if and $sso.oidc.enabled (not $sso.existingSecret) }}
# Секрет OIDC-клиента внешнего IdP. В проде лучше sso.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cr.ssoSecretName" . }}
  labels:
    {{- include "cr.metaLabels" . | nindent 4 }}
type: Opaque
stringData:
  OIDC_CLIENT_SECRET: {{ required "sso.oidc.clientSecret или sso.existingSecret обязателен" $sso.oidc.clientSecret | quote }}
{{- end }}
