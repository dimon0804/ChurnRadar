# kind-кластер ChurnRadar: 1 control-plane + 2 worker.
# Traefik публикуется как NodePort 30080, порт пробрасывается на хост :8080.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: churn-radar
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
