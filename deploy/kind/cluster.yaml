# kind-кластер ChurnRadar: 1 control-plane + 2 worker.
# Traefik публикуется как NodePort 30080, порт пробрасывается на хост :8080.
# Образ узлов закреплён: чарт требует Kubernetes >= 1.30 (preStop.sleep),
# а версия по умолчанию зависит от версии kind (v0.29 -> v1.33.1).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: churn-radar
nodes:
  - role: control-plane
    image: kindest/node:v1.33.1
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    image: kindest/node:v1.33.1
  - role: worker
    image: kindest/node:v1.33.1
