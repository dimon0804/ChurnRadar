# Временный compose для проверки ядра (ingest, scoring, api, simulator) без гейтвея и фронта.
# Запуск: docker compose -f docker-compose.core.yml up -d --build
# Заголовки X-User-* вместо гейтвея подставляет AUTH_DEV_USER (только для локальной проверки).
name: churnradar-core

# Как в общем compose платформы: корневая ФС только для чтения, запись — только в /tmp, без capabilities.
x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

x-common-env: &common-env
  DATABASE_URL: postgresql://churn:churn@postgres:5432/churn
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  LOG_LEVEL: INFO
  METRICS_TOKEN: churn-metrics-token

services:
  postgres:
    image: postgres:16-alpine
    # VACUUM и параллельные запросы на 200k клиентов не помещаются в стандартные 64 МБ /dev/shm
    shm_size: 256m
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn
      POSTGRES_DB: churn
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "127.0.0.1:4222:4222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: services/migrate/Dockerfile
    <<: *hardening
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    <<: *hardening
    # Пик на снимке: 100k аккаунтов ≈ 1.4 ГБ, 200k ≈ 2.8 ГБ
    mem_limit: 3500m
    mem_reservation: 256m
    environment:
      <<: *common-env
      SEED_ON_START: "true"
      SEED_REFERENCE_TIME: "2026-10-19T15:00:00Z"
      AUTH_DEV_USER: ${AUTH_DEV_USER:-admin}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  scoring:
    build:
      context: .
      dockerfile: services/scoring/Dockerfile
    <<: *hardening
    # Полный пересчёт: 100k ≈ 2 ГБ, 200k ≈ 2.8 ГБ (с пулом процессов)
    mem_limit: 3500m
    mem_reservation: 256m
    environment:
      <<: *common-env
      RESCORE_INTERVAL_S: "60"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    <<: *hardening
    environment:
      <<: *common-env
      SIMULATOR_URL: http://simulator:8000
      AUTH_DEV_USER: ${AUTH_DEV_USER:-admin}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    <<: *hardening
    # Генерация 200k держит набор в памяти ≈ 1.8 ГБ
    mem_limit: 2500m
    mem_reservation: 256m
    environment:
      <<: *common-env
      INGEST_URL: http://ingest:8000
      SNAPSHOT_REFERENCE: ${SNAPSHOT_REFERENCE:-null}
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      ingest:
        condition: service_healthy

volumes:
  pgdata:
  natsdata:
