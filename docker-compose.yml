name: churn-radar

# Everything has a default, so `docker compose up -d` works on a clean clone without .env.
# Overrides go to .env (see .env.example). Panel: http://localhost:8080

x-restart: &restart
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-churn}:${POSTGRES_PASSWORD:-churn}@postgres:5432/${POSTGRES_DB:-churn}
  REDIS_URL: redis://redis:6379/0
  NATS_URL: nats://nats:4222
  METRICS_TOKEN: ${METRICS_TOKEN:-churn-metrics-demo-token}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # почта: по умолчанию Mailpit — письма никуда не уходят, их видно на http://localhost:8025
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURITY: ${SMTP_SECURITY:-none}
  SMTP_FROM: ${SMTP_FROM:-care@churnradar.example}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ChurnRadar}

x-app-hardening: &app-hardening
  read_only: true
  tmpfs: ["/tmp:size=64m"]
  cap_drop: [ALL]

services:
  # ---------------------------------------------------------------- gateway
  traefik:
    <<: *restart
    image: traefik:v3.3.6
    command: ["--configFile=/etc/traefik/traefik.yml"]
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/traefik:/etc/traefik:ro
    read_only: true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--configFile=/etc/traefik/traefik.yml"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      auth: {condition: service_healthy}
      web: {condition: service_healthy}
      notifier: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  # ---------------------------------------------------------------- data
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn}
      POSTGRES_USER: ${POSTGRES_USER:-churn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    shm_size: 256m
    deploy:
      resources:
        limits: {cpus: "2", memory: 1G}

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    read_only: true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 192M}

  nats:
    <<: *restart
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222", "--name", "churn-nats"]
    volumes:
      - natsdata:/data
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1", memory: 256M}

  nats-init:
    image: natsio/nats-box:0.17.0
    restart: "no"
    command:
      - sh
      - -c
      - >-
        nats --server nats://nats:4222 stream info CHURN >/dev/null 2>&1 ||
        nats --server nats://nats:4222 stream add CHURN --subjects 'churn.>' --storage file
        --retention limits --max-age 24h --discard old --replicas 1 --defaults
    depends_on:
      nats: {condition: service_healthy}

  migrate:
    image: churn-radar-auth:dev
    build: {context: services/auth}
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    <<: *app-hardening
    depends_on:
      postgres: {condition: service_healthy}

  # ---------------------------------------------------------------- platform
  auth:
    <<: [*restart, *app-hardening]
    image: churn-radar-auth:dev
    build: {context: services/auth}
    environment:
      <<: *app-env
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ANALYST_USERNAME: ${ANALYST_USERNAME:-analyst}
      ANALYST_PASSWORD: ${ANALYST_PASSWORD:-analyst}
      # SSO: кнопки на /login появляются, только когда IdP отвечает (профиль sso поднимает Authentik)
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_PUBLIC_ISSUER: ${OIDC_PUBLIC_ISSUER:-http://localhost:9000/application/o/churn-radar/}
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-http://authentik-server:9000/application/o/churn-radar/}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-churn-radar}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-churn-radar-demo-secret}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email churn-radar}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-Войти через Authentik (OIDC)}
      SAML_ENABLED: ${SAML_ENABLED:-true}
      SAML_IDP_METADATA_URL: ${SAML_IDP_METADATA_URL:-http://authentik-server:9000/application/saml/churn-radar-saml/metadata/}
      SAML_IDP_PUBLIC_URL: ${SAML_IDP_PUBLIC_URL:-http://localhost:9000}
      SAML_DISPLAY_NAME: ${SAML_DISPLAY_NAME:-Войти через Authentik (SAML)}
      SSO_ADMIN_GROUPS: ${SSO_ADMIN_GROUPS:-churn-admins}
      SSO_ANALYST_GROUPS: ${SSO_ANALYST_GROUPS:-churn-analysts}
      SSO_DEFAULT_ROLE: ${SSO_DEFAULT_ROLE:-}
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1", memory: 256M}

  notifier:
    <<: [*restart, *app-hardening]
    image: churn-radar-notifier:dev
    build: {context: services/notifier}
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats: {condition: service_healthy}
    deploy:
      replicas: ${NOTIFIER_REPLICAS:-2}
      resources:
        limits: {cpus: "0.5", memory: 64M}

  web:
    <<: [*restart, *app-hardening]
    image: churn-radar-web:dev
    build: {context: ., dockerfile: web/Dockerfile}
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 64M}

  # ---------------------------------------------------------------- core (services/api, ingest, scoring, simulator)
  core-migrate:
    image: churn-radar-migrate:dev
    build: {context: ., dockerfile: services/migrate/Dockerfile}
    restart: "no"
    environment:
      <<: *app-env
    <<: *app-hardening
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: [*restart, *app-hardening]
    image: churn-radar-api:dev
    build: {context: ., dockerfile: services/api/Dockerfile}
    environment:
      <<: *app-env
      SIMULATOR_URL: http://simulator:8000
    depends_on:
      core-migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      nats-init: {condition: service_completed_successfully}
    deploy:
      replicas: ${API_REPLICAS:-2}
      resources:
        limits: {cpus: "1", memory: 384M}

  ingest:
    <<: [*restart, *app-hardening]
    image: churn-radar-ingest:dev
    build: {context: ., dockerfile: services/ingest/Dockerfile}
    environment:
      <<: *app-env
      SEED_ON_START: "true"
      SEED_REFERENCE_TIME: ${SEED_REFERENCE_TIME:-2026-10-19T15:00:00Z}
    depends_on:
      core-migrate: {condition: service_completed_successfully}
      nats-init: {condition: service_completed_successfully}
    deploy:
      resources:
        limits: {cpus: "1", memory: 3G}

  scoring:
    <<: [*restart, *app-hardening]
    image: churn-radar-scoring:dev
    stop_grace_period: 60s
    build: {context: ., dockerfile: services/scoring/Dockerfile}
    environment:
      <<: *app-env
      SCORING_WORKERS: ${SCORING_WORKERS:-2}
    depends_on:
      core-migrate: {condition: service_completed_successfully}
      nats-init: {condition: service_completed_successfully}
    deploy:
      replicas: ${SCORING_REPLICAS:-2}
      resources:
        limits: {cpus: "2", memory: 3G}

  simulator:
    <<: [*restart, *app-hardening]
    image: churn-radar-simulator:dev
    stop_grace_period: 60s
    build: {context: ., dockerfile: services/simulator/Dockerfile}
    environment:
      <<: *app-env
      INGEST_URL: http://ingest:8000
      SNAPSHOT_REFERENCE: ${SNAPSHOT_REFERENCE:-null}
    depends_on:
      ingest: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1", memory: 2G}

  # оповещения: отдельный потребитель churn.scores.updated, остальные сервисы о нём не знают
  alerts:
    <<: [*restart, *app-hardening]
    image: churn-radar-alerts:dev
    build: {context: ., dockerfile: services/alerts/Dockerfile}
    environment:
      <<: *app-env
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ALERT_LOSS_JUMP_EUR: ${ALERT_LOSS_JUMP_EUR:-50}
      ALERT_TOTAL_LOSS_JUMP_PCT: ${ALERT_TOTAL_LOSS_JUMP_PCT:-10}
      ALERT_COOLDOWN_MIN: ${ALERT_COOLDOWN_MIN:-60}
      ALERTS_BULK_THRESHOLD: ${ALERTS_BULK_THRESHOLD:-20}
      # пусто — канал выключен, лента в панели работает всегда
      WEBHOOK_URL: ${ALERTS_WEBHOOK_URL:-}
      WEBHOOK_SECRET: ${ALERTS_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    stop_grace_period: 30s
    depends_on:
      core-migrate: {condition: service_completed_successfully}
      nats-init: {condition: service_completed_successfully}
    deploy:
      replicas: ${ALERTS_REPLICAS:-2}
      resources:
        limits: {cpus: "0.5", memory: 192M}

  # ---------------------------------------------------------------- mail
  # тестовый почтовый ящик: ловит все письма стенда, веб-интерфейс на :8025
  mailpit:
    <<: *restart
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  # ---------------------------------------------------------------- observability
  prometheus:
    <<: *restart
    image: prom/prometheus:v3.3.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    configs:
      - source: metrics_token
        target: /run/secrets/metrics_token
    # read_only несовместим с configs.content: compose пишет файл в контейнер при старте
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}

  grafana:
    <<: *restart
    image: grafana/grafana:11.6.1
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_LANGUAGE: ru-RU
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Grafana 11 сама ставит при старте grafana-lokiexplore-app и grafana-pyroscope-app: Loki и
      # Pyroscope у нас нет, плагины только тянутся из сети и сыплют ошибки в консоль браузера.
      # PREINSTALL_DISABLED отключает установку, DISABLE_PLUGINS не даёт загрузиться уже
      # установленным в volume grafanadata.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_PLUGINS: grafana-lokiexplore-app,grafana-pyroscope-app
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/churn.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1", memory: 256M}

  nats-exporter:
    <<: *restart
    image: natsio/prometheus-nats-exporter:0.16.0
    command: ["-varz", "-connz", "-jsz=all", "-port", "7777", "http://nats:8222"]
    read_only: true
    depends_on:
      nats: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  postgres-exporter:
    <<: *restart
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-churn}:${POSTGRES_PASSWORD:-churn}@postgres:5432/${POSTGRES_DB:-churn}?sslmode=disable
    read_only: true
    depends_on:
      postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  redis-exporter:
    <<: *restart
    image: oliver006/redis_exporter:v1.70.0
    environment:
      REDIS_ADDR: redis://redis:6379
    read_only: true
    depends_on:
      redis: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "0.25", memory: 64M}

  # ---------------------------------------------------------------- SSO (docker compose --profile sso up -d)
  # Authentik — IdP для входа через OIDC и SAML. У него своя маленькая БД, данных панели он не видит.
  # С версии 2025.10 Authentik обходится без Redis: кэш и очередь задач живут в Postgres.
  # Группы, пользователи и провайдеры создаёт blueprint deploy/authentik/blueprints/churn-radar.yaml.
  authentik-postgres:
    <<: *restart
    profiles: [sso]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik-demo-db}
    volumes:
      - authentikdb:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "1", memory: 256M}

  authentik-server:
    <<: *restart
    profiles: [sso]
    image: ghcr.io/goauthentik/server:2026.8.5
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:-churn-radar-demo-authentik-secret-key-change-me-0123456789}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:-authentik-demo-db}
      # учётка akadmin для админки Authentik, создаётся при первом запуске
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_ADMIN_PASSWORD:-authentik}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_ADMIN_EMAIL:-akadmin@churn-radar.local}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_DISABLE_STARTUP_ANALYTICS: "true"
      AUTHENTIK_LOG_LEVEL: ${AUTHENTIK_LOG_LEVEL:-warning}
      AUTHENTIK_WEB__WORKERS: "1"
      # для blueprint'а: адрес панели, клиент OIDC, пароли демо-пользователей
      CHURN_RADAR_PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CHURN_RADAR_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-churn-radar}
      CHURN_RADAR_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-churn-radar-demo-secret}
      CHURN_RADAR_SSO_ADMIN_PASSWORD: ${SSO_DEMO_ADMIN_PASSWORD:-admin}
      CHURN_RADAR_SSO_MARKETER_PASSWORD: ${SSO_DEMO_MARKETER_PASSWORD:-marketer}
      CHURN_RADAR_SSO_OUTSIDER_PASSWORD: ${SSO_DEMO_OUTSIDER_PASSWORD:-outsider}
    ports:
      - "${AUTHENTIK_PORT:-9000}:9000"
    volumes:
      - ./deploy/authentik/blueprints:/blueprints/churn-radar:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      authentik-postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "2", memory: 1G}

  authentik-worker:
    <<: *restart
    profiles: [sso]
    image: ghcr.io/goauthentik/server:2026.8.5
    command: worker
    environment: *authentik-env
    volumes:
      - ./deploy/authentik/blueprints:/blueprints/churn-radar:ro
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      authentik-postgres: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G}

configs:
  metrics_token:
    content: ${METRICS_TOKEN:-churn-metrics-demo-token}

volumes:
  pgdata:
  redisdata:
  natsdata:
  promdata:
  grafanadata:
  authentikdb:
