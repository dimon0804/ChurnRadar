[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "riskcore"
version = "1.0.0"
description = "Объяснимая модель риска оттока клиентов хостинга"
requires-python = ">=3.12"
authors = [{ name = "dimon0804", email = "dimongamedeveloper@yandex.ru" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "pyyaml>=6", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
include = ["riskcore*"]

[tool.setuptools.package-data]
riskcore = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
