[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "svckit"
version = "1.0.0"
description = "Общий код сервисов ChurnRadar: ошибки, авторизация по заголовкам, NATS, Postgres, логи, метрики"
requires-python = ">=3.12"
authors = [{ name = "dimon0804", email = "dimongamedeveloper@yandex.ru" }]
dependencies = [
    "fastapi>=0.110",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
db = ["asyncpg>=0.29"]
bus = ["nats-py>=2.6"]
settings = ["pydantic-settings>=2.2"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["svckit*"]

[tool.setuptools.package-data]
svckit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты против настоящих Postgres и NATS (нужны TEST_DATABASE_URL и TEST_NATS_URL)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["svckit"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "nats", "nats.*"]
ignore_missing_imports = true
