apiVersion: 1

# JSON дашбордов монтируется из monitoring/grafana/dashboards в /var/lib/grafana/dashboards
providers:
  - name: churn-radar
    orgId: 1
    folder: ChurnRadar
    folderUid: churn-radar
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
