groups:
  - name: churn-business
    rules:
      - alert: ChurnExpectedLossGrowth
        expr: |
          (
            max(churn_expected_loss_eur)
            - max(churn_expected_loss_eur offset 1h)
          ) / max(churn_expected_loss_eur offset 1h) > 0.2
          and max(churn_expected_loss_eur offset 1h) > 0
        for: 5m
        labels:
          severity: warning
          team: marketing
        annotations:
          summary: "Ожидаемая потеря выросла на {{ $value | humanizePercentage }} за час"
          description: >-
            За последний час ожидаемая потеря выручки от оттока выросла больше чем на 20%.
            Откройте ChurnRadar, отсортируйте клиентов по «Ожидаемой потере» и посмотрите,
            кто недавно перешёл в высокий риск и почему — стоит связаться с ними первыми.

      - alert: ChurnHighRiskCustomersGrowth
        expr: |
          sum(churn_customers_by_risk_level{level="high"})
          - sum(churn_customers_by_risk_level{level="high"} offset 1h) > 0
          and
          sum(churn_customers_by_risk_level{level="high"})
          > 1.2 * sum(churn_customers_by_risk_level{level="high"} offset 1h)
        for: 5m
        labels:
          severity: info
          team: marketing
        annotations:
          summary: "Клиентов под высоким риском стало больше на 20%+ за час"
          description: >-
            Число клиентов в группе высокого риска за час выросло больше чем на 20%.
            Проверьте в ChurnRadar раздел «Клиенты под риском» и причины в карточках.

  # Дрейф признаков: scoring после каждого полного пересчёта считает PSI распределения сил
  # сигналов против эталона калибровки (riskcore.drift). Серий нет, пока эталона нет или
  # база меньше 200 платных услуг — тогда и алерт молчит.
  - name: churn-model
    rules:
      - alert: ModelDrift
        expr: max by (feature) (churn_feature_psi) > 0.25
        for: 15m
        labels:
          severity: warning
          team: model
        annotations:
          summary: "Признак {{ $labels.feature }} ушёл от эталона калибровки: PSI {{ $value | printf \"%.2f\" }}"
          description: >-
            Распределение признаков ушло от эталона калибровки, модель устарела: вероятности
            и ожидаемая потеря могут заметно врать. Перезапустите python -m tools.calibration
            на свежих данных и выкатите новую model_tables.json. Меньше 0,1 — норма,
            0,1–0,25 — заметный сдвиг, выше 0,25 — пора перекалибровать.

  - name: churn-platform
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Сервис {{ $labels.service }} недоступен"
          description: "Prometheus не может собрать метрики с {{ $labels.instance }} (job {{ $labels.job }}) больше минуты."

      - alert: ScoringLagHigh
        expr: |
          sum by (stream_name, consumer_name) (jetstream_consumer_num_pending{stream_name="CHURN"}) > 0
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Пересчёт отстаёт: в очереди {{ $value }} необработанных событий"
          description: >-
            Консьюмер {{ $labels.consumer_name }} потока {{ $labels.stream_name }} не успевает
            разбирать события больше 30 секунд. Панель показывает устаревшие оценки риска.

      - alert: ScoringStale
        expr: |
          (time() - max(churn_last_scored_timestamp_seconds)) > 30
          and on ()
          sum(increase(http_requests_total{service="ingest", method=~"POST|PUT", status=~"2.."}[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Данные источника менялись, но пересчёта не было {{ $value | humanizeDuration }}"
          description: >-
            Ingest принимал изменения за последние 5 минут, а последний пересчёт оценок был
            больше 30 секунд назад. Проверьте воркеры scoring и NATS.

      - alert: OutboxStuck
        expr: max by (service) (outbox_oldest_pending_seconds) > 120
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "События {{ $labels.service }} застряли в outbox: старейшему {{ $value | humanizeDuration }}"
          description: >-
            Данные сохранены, но событие для пересчёта не уходит в NATS дольше двух минут.
            Пока очередь не разойдётся, scoring не знает об изменениях. Проверьте NATS и логи
            {{ $labels.service }} (outbox_publish_paused, outbox_relay_error).

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[5m]))
          / sum by (service) (rate(traefik_service_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Больше 5% ошибок 5xx у {{ $labels.service }}"
          description: "Доля ответов 5xx через шлюз за 5 минут: {{ $value | humanizePercentage }}."

      - alert: SSEClientsDrop
        expr: |
          sum(notifier_connected_clients) < 0.5 * sum(notifier_connected_clients offset 5m)
          and
          sum(notifier_connected_clients offset 5m) >= 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Число SSE-клиентов упало больше чем вдвое за 5 минут"
          description: >-
            Сейчас подключено {{ $value }} клиентов живых обновлений. Возможны проблемы
            с notifier, шлюзом или NATS — панели перестанут обновляться сами.

      - alert: AlertsDeliveryFailing
        expr: |
          sum by (channel) (increase(alerts_failed_total[15m])) > 0
          unless on (channel)
          sum by (channel) (increase(alerts_sent_total[15m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Уведомления не доходят в {{ $labels.channel }}"
          description: >-
            За 15 минут ни одна попытка отправить уведомление в {{ $labels.channel }} не прошла.
            В панели всё видно, внешний канал — нет. Проверьте настройки канала (адрес webhook,
            SMTP_*, токен бота), логи alerts (delivery_failed) и таблицу alerts.deliveries.

      - alert: AlertsTelegramBotPollFailing
        expr: sum(increase(alerts_bot_poll_errors_total[10m])) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Telegram-бот не получает сообщения"
          description: >-
            Реплика alerts, которая ведёт опрос getUpdates, за 10 минут получила {{ $value }} ошибок.
            Бот не отвечает на команды и не привязывает новые чаты; уведомления в Telegram
            при этом продолжают уходить. Проверьте TELEGRAM_BOT_TOKEN и доступ к api.telegram.org.

  - name: churn-connectors
    rules:
      # Коннекторы (pull): каждая реплика ingest отдаёт значения из source.connectors, поэтому max by (source).
      # До первого успешного запуска connector_last_success_timestamp — момент включения коннектора.
      - alert: ConnectorStale
        expr: |
          (time() - max by (source) (connector_last_success_timestamp))
          > 3 * max by (source) (connector_interval_seconds) + 300
          and on (source)
          max by (source) (connector_enabled) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Коннектор {{ $labels.source }} не обновлял данные {{ $value | humanizeDuration }}"
          description: >-
            Источник {{ $labels.source }} включён, но успешного запуска не было дольше трёх интервалов
            расписания (плюс 5 минут запаса). Данные из него в панели устаревают. Откройте «Данные» →
            «Источники»: там последняя ошибка и история запусков. Частые причины — источник недоступен,
            истёк токен (CONNECTOR_TOKEN_*), ни одна реплика ingest не стала исполнителем
            (connector_leader).
