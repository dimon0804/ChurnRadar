rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'churn_expected_loss_eur{job="api",service="api"}'
        values: '1000x60 1500x20'
      - series: 'notifier_connected_clients{instance="a"}'
        values: '10x20 2x20'
      - series: 'jetstream_consumer_num_pending{stream_name="CHURN",consumer_name="scoring"}'
        values: '0 5x5'
      # ingest: очередь копится 6 минут; api: возраст держится ниже порога
      - series: 'outbox_oldest_pending_seconds{job="ingest",service="ingest"}'
        values: '0+60x6'
      - series: 'outbox_oldest_pending_seconds{job="api",service="api"}'
        values: '100x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: OutboxStuck
        exp_alerts: []
      - eval_time: 5m
        alertname: OutboxStuck
        exp_alerts:
          - exp_labels: {severity: warning, service: ingest}
            exp_annotations:
              summary: "События ingest застряли в outbox: старейшему 5m 0s"
              description: "Данные сохранены, но событие для пересчёта не уходит в NATS дольше двух минут. Пока очередь не разойдётся, scoring не знает об изменениях. Проверьте NATS и логи ingest (outbox_publish_paused, outbox_relay_error)."
      - eval_time: 70m
        alertname: ChurnExpectedLossGrowth
        exp_alerts:
          - exp_labels: {severity: warning, team: marketing}
            exp_annotations:
              summary: "Ожидаемая потеря выросла на 50% за час"
              description: "За последний час ожидаемая потеря выручки от оттока выросла больше чем на 20%. Откройте ChurnRadar, отсортируйте клиентов по «Ожидаемой потере» и посмотрите, кто недавно перешёл в высокий риск и почему — стоит связаться с ними первыми."
      - eval_time: 24m
        alertname: SSEClientsDrop
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Число SSE-клиентов упало больше чем вдвое за 5 минут"
              description: "Сейчас подключено 2 клиентов живых обновлений. Возможны проблемы с notifier, шлюзом или NATS — панели перестанут обновляться сами."
      - eval_time: 3m
        alertname: ScoringLagHigh
        exp_alerts:
          - exp_labels: {severity: warning, stream_name: CHURN, consumer_name: scoring}
            exp_annotations:
              summary: "Пересчёт отстаёт: в очереди 5 необработанных событий"
              description: "Консьюмер scoring потока CHURN не успевает разбирать события больше 30 секунд. Панель показывает устаревшие оценки риска."

  # alerts: webhook падает каждую минуту и ни разу не доставил; telegram ошибается, но доходит
  - interval: 1m
    input_series:
      - series: 'alerts_failed_total{job="alerts",channel="webhook"}'
        values: '0+2x40'
      - series: 'alerts_sent_total{job="alerts",channel="webhook"}'
        values: '0x40'
      - series: 'alerts_failed_total{job="alerts",channel="telegram"}'
        values: '0+1x40'
      - series: 'alerts_sent_total{job="alerts",channel="telegram"}'
        values: '0+1x40'
    alert_rule_test:
      - eval_time: 5m
        alertname: AlertsDeliveryFailing
        exp_alerts: []
      - eval_time: 30m
        alertname: AlertsDeliveryFailing
        exp_alerts:
          - exp_labels: {severity: warning, channel: webhook}
            exp_annotations:
              summary: "Оповещения не доходят в webhook"
              description: "За 15 минут ни одна попытка отправить оповещение в webhook не прошла. Лента в панели работает, внешний канал — нет. Проверьте адрес webhook или токен и chat id Telegram, логи alerts (delivery_failed) и таблицу alerts.deliveries."
