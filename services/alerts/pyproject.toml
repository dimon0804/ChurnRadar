[project]
name = "churnradar-alerts"
version = "1.0.0"
description = "Оповещения о росте риска оттока: webhook, Telegram и лента в панели"
requires-python = ">=3.12"
authors = [{ name = "dimon0804", email = "dimongamedeveloper@yandex.ru" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты против реальных Postgres и NATS"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
