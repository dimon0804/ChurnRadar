[project]
name = "churnradar-ingest"
version = "1.0.0"
description = "Приём исходных данных ChurnRadar: снимок и поток изменений"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты против настоящих Postgres и NATS (нужны TEST_DATABASE_URL и TEST_NATS_URL)"]
