[project]
name = "churnradar-migrate"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["asyncpg==0.30.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: тесты против настоящего Postgres (нужен TEST_DATABASE_URL)"]
